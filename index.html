<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Art Gallery Teok - Full Scroll</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial;background:#000;color:#fff}
header{background:#000;color:#fff;text-align:center;padding:25px 15px;position:sticky;top:0;z-index:100;border-bottom:2px solid #ff0000}
.btn{background:#ff0000;color:#fff;padding:12px 25px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:10px}
.container{max-width:500px;margin:auto}
.card{width:100%;height:100vh;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;scroll-snap-align:start;border-bottom:2px solid #222;position:relative}
.card iframe{width:100%;height:85vh;border:0;max-width:400px;border-radius:15px}
.info{padding:15px;text-align:center;width:100%;background:#000}
.info h3{color:#ff0000;margin-bottom:5px}
#gallery{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
footer{background:#000;color:#666;text-align:center;padding:15px}
.count{position:fixed;top:80px;right:15px;background:#ff0000;color:#fff;padding:8px 15px;border-radius:20px;font-weight:bold;z-index:200}
</style>
</head>
<body>

<header>
<h1>VENUS ART GALLERY TEOK 🎨</h1>
<p>Full Scroll - তললৈ Scroll কৰক 👇</p>
<a class="btn" href="https://youtube.com/@venusartgalleryteok8649" target="_blank">🔴 Subscribe</a>
</header>

<div class="count" id="count">1 / 2</div>
<div id="gallery"></div>

<footer>© 2026 Venus Art - তললৈ Scroll কৰি থাকক ❤️</footer>

<script>
// ========================================================
// 👉 নতুন Video ID ইয়াত Add কৰক - Full Scroll Auto হব 👈
// ========================================================
const ALL_VIDEOS = [
  "f_Wdrv3jyb0",   // Video 1
  "m8jwmkeqqis",   // Video 2 - আপুনি দিয়া নতুন
  // নতুন Video ইয়াত Add কৰক 👇
  // "NEW_ID",
];
// ========================================================

let html = "";
ALL_VIDEOS.forEach((id, index)=>{
  html += `
  <div class="card">
    <iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1" allowfullscreen loading="lazy"></iframe>
    <div class="info">
      <h3>Art Video ${index+1} 🎨</h3>
      <p>Venus Art Gallery Teok</p>
    </div>
  </div>`;
});
document.getElementById("gallery").innerHTML = html;

// Scroll ত Number Change হব
const gallery = document.getElementById("gallery");
gallery.addEventListener("scroll", ()=>{
  let scrollPos = gallery.scrollTop;
  let cardHeight = window.innerHeight;
  let current = Math.round(scrollPos / cardHeight) + 1;
  if(current > ALL_VIDEOS.length) current = ALL_VIDEOS.length;
  if(current < 1) current = 1;
  document.getElementById("count").innerText = current + " / " + ALL_VIDEOS.length;
});
</script>

</body>
</html>
