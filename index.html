<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENUS - Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080a;color:#fff;font-family:system-ui}
.header{background:#111;padding:16px;text-align:center;position:sticky;top:0}
.header h1{color:#ff4d88;letter-spacing:4px}
.box{background:#18181f;border:1px solid #333;border-radius:20px;padding:16px;margin:12px auto;max-width:500px;display:none}
.box.show{display:block}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#fff;color:#000;margin:7px 0;font-weight:600}
.btn{background:linear-gradient(135deg,#ff4d88,#ff8fab);border:0;color:#fff;width:100%;padding:14px;border-radius:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:800px;margin:0 auto}
.card{background:#18181f;border-radius:18px;overflow:hidden;border:1px solid #333;position:relative}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.info{padding:10px}
.price{color:#ff4d88;font-weight:800}
.del{position:absolute;top:6px;right:6px;background:red;color:#fff;border:0;width:30px;height:30px;border-radius:50%;display:none}
.admin.del{display:block}
.bar{height:8px;background:#222;border-radius:20px;display:none;margin:10px 0;overflow:hidden}
.fill{height:100%;background:#ff4d88;width:0%}
.lock{display:flex;justify-content:space-between;padding:12px;max-width:800px;margin:0 auto}
</style>
</head>
<body>

<div class="header">
<h1>🎨 VENUS</h1>
<p style="font-size:11px;opacity:.5">PAINTING & CRAFT • WhatsApp: 9101573700</p>
</div>

<div class="lock">
<div id="st" style="font-size:12px;opacity:.6">🔓 Public View</div>
<button style="background:#222;color:#ff4d88;border:1px solid #333;padding:6px 12px;border-radius:20px" onclick="toggle()">🔐 Admin</button>
</div>

<div class="box" id="adminBox">
<h3 style="color:#ff4d88;text-align:center">👑 Admin - Add Painting</h3>
<input type="file" id="file" accept="image/*">
<input id="pname" placeholder="নাম">
<input id="price" placeholder="দাম" type="number">
<div class="bar" id="bar"><div class="fill" id="fill"></div></div>
<div id="msg" style="text-align:center;color:#ff4d88;height:20px"></div>
<button class="btn" id="btn" onclick="up()">🚀 Add কৰক</button>
</div>

<div class="grid" id="grid"></div>

<script>
const PASS="VENUS2026";
const WA="919101573700";
let isAdmin=false;
let products=JSON.parse(localStorage.getItem('venus_final')||localStorage.getItem('venus_public')||localStorage.getItem('venus_p')||'[]');

function toggle(){
if(isAdmin){
isAdmin=false;document.body.classList.remove('admin');
adminBox.classList.remove('show');
st.innerText="🔓 Public View";
}else{
let p=prompt("Admin Password:");
if(p===PASS){
isAdmin=true;document.body.classList.add('admin');
adminBox.classList.add('show');
st.innerText="👑 ADMIN MODE";
}else if(p){alert("Wrong Password!");}
}
}

function compress(file){
return new Promise(res=>{
let r=new FileReader();
r.onload=e=>{
let img=new Image();
img.onload=()=>{
let c=document.createElement('canvas');
let max=700,w=img.width,h=img.height;
if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}
c.width=w;c.height=h;
c.getContext('2d').drawImage(img,0,0,w,h);
res(c.toDataURL('image/jpeg',0.6));
};
img.src=e.target.result;
};
r.readAsDataURL(file);
});
}

async function up(){
let f=file.files[0];
if(!f){alert('Photo লওক');return;}
btn.disabled=true;bar.style.display='block';fill.style.width='30%';msg.innerText='Compress...';
let comp=await compress(f);
fill.style.width='80%';msg.innerText='Saving...';
products.unshift({id:Date.now(),name:pname.value||'Art',price:price.value||'99',photo:comp});
localStorage.setItem('venus_final',JSON.stringify(products));
fill.style.width='100%';msg.innerText='✅ Live!';
file.value='';pname.value='';price.value='';
render();
setTimeout(()=>{bar.style.display='none';msg.innerText='';btn.disabled=false;btn.innerText='🚀 Add কৰক';},1500);
}

function render(){
let g=document.getElementById('grid');
if(!products.length){g.innerHTML='<div style="grid-column:1/3;text-align:center;padding:60px;opacity:.4">🎨 Painting নাই</div>';return;}
let h='';
products.forEach(p=>{
let m=encodeURIComponent('Hi Venus! '+p.name+' ₹'+p.price+' লাগে');
h+=`<div class="card"><div style="position:relative"><img src="${p.photo}"><button class="del" onclick="delp(${p.id})">✕</button></div><div class="info"><div>${p.name}</div><div class="price">₹${p.price}</div><button class="btn" style="padding:8px;margin-top:6px" onclick="window.open('https://wa.me/${WA}?text=${m}')">Buy - 9101573700</button></div></div>`;
});
g.innerHTML=h;
}

function delp(id){
if(!isAdmin){alert('Admin Login লাগিব');return;}
if(confirm('Delete?')){
products=products.filter(p=>p.id!=id);
localStorage.setItem('venus_final',JSON.stringify(products));
render();
}
}
render();
</script>
</body>
</html>
