<!DOCTYPE html>
<html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxomBook - অসমৰ নিজৰ Facebook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f0f2f5;color:#050505}
header{background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;color:#0866ff}
.logo span{background:#0866ff;color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:8px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:none;padding:8px 14px;border-radius:20px;font-weight:600;cursor:pointer}
.btn-primary{background:#0866ff;color:#fff}
.btn-light{background:#e4e6eb;color:#050505}
.btn-danger{background:#ff3040;color:#fff}
.user-pill{display:flex;align-items:center;gap:8px;background:#f0f2f5;padding:4px 10px 4px 4px;border-radius:20px}
.avatar{width:32px;height:32px;border-radius:50%;background:#0866ff;color:#fff;display:grid;place-items:center;font-weight:700}
.main{max-width:680px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin-bottom:12px;padding:12px}
.create-top{display:flex;gap:8px;align-items:center}
.create-top input{flex:1;background:#f0f2f5;border:none;padding:10px 14px;border-radius:20px;outline:none}
.actions{display:flex;justify-content:space-around;border-top:1px solid #e4e6eb;margin-top:10px;padding-top:8px}
.actions button{flex:1;border:none;background:transparent;padding:8px;font-weight:600;color:#65676b;cursor:pointer;border-radius:6px}
.post-img{width:100%;border-radius:10px;margin-top:10px;max-height:500px;object-fit:cover}
textarea{width:100%;border:none;resize:none;outline:none;font-size:18px;padding:8px 0;min-height:60px}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:400px}
.modal h2{margin-bottom:12px;color:#0866ff;text-align:center}
.modal input{width:100%;padding:12px;border:1px solid #dddfe2;border-radius:8px;margin:6px 0;background:#f5f6f7}
.modal.close{float:right;border:none;background:#e4e6eb;width:28px;height:28px;border-radius:50%;cursor:pointer}
.post-head{display:flex;justify-content:space-between;align-items:center}
.post-user{display:flex;gap:8px;align-items:center}
.post-menu{position:relative}
.dots{border:none;background:#f0f2f5;width:32px;height:32px;border-radius:50%;cursor:pointer;font-weight:700}
.menu{position:absolute;right:0;top:36px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);border-radius:8px;overflow:hidden;display:none;min-width:120px;z-index:10}
.menu button{width:100%;border:none;background:#fff;padding:10px 14px;text-align:left;cursor:pointer}
.badge{background:#ffba00;color:#000;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:6px}
</style></head><body>
<header>
<div class="logo"><span>A</span> AxomBook</div>
<div class="nav" id="nav">
<button class="btn btn-light" onclick="openModal('login')">Log In</button>
<button class="btn btn-primary" onclick="openModal('signup')">Sign Up</button>
<button class="btn btn-light" onclick="openModal('adminLogin')">Admin</button>
<div id="loggedUser" class="hidden user-pill"><div class="avatar" id="av">M</div><b id="un">Manuj</b><button class="btn btn-danger" style="padding:4px 10px" onclick="logout()">Logout</button></div>
</div></header>
<div class="main">
<div class="card"><div class="create-top"><div class="avatar" id="av2">M</div><input id="postInput" type="text" placeholder="Login কৰক, তাৰ পিছত Post কৰক..." onclick="checkLogin()" readonly></div>
<div id="editor" class="hidden"><textarea id="postText" placeholder="কি ভাবি আছে?"></textarea><input type="file" id="postFile" accept="image/*" style="margin:8px 0"><button class="btn btn-primary" style="width:100%" onclick="createPost()">Post</button></div>
<div class="actions"><button onclick="checkLogin()">📷 Photo</button><button onclick="checkLogin()">🎥 Video</button><button onclick="checkLogin()">😊 Feeling</button></div>
</div><div id="feed"></div></div>
<div id="modalBg" class="modal-bg hidden" onclick="if(event.target==this)closeModal()">
<div class="modal"><button class="close" onclick="closeModal()">X</button>
<div id="m-signup"><h2>Sign Up</h2><input id="s-name" placeholder="Full Name"><input id="s-email" placeholder="Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doSignup()">Sign Up</button></div>
<div id="m-login" class="hidden"><h2>Log In</h2><input id="l-email" placeholder="Email"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Log In</button></div>
<div id="m-adminLogin" class="hidden"><h2>Admin Log In</h2><input id="al-email" value="venus.artgallery@gmail.com"><input id="al-pass" type="password" value="admin123"><button class="btn btn-primary" style="width:100%;margin-top:8px;background:#111" onclick="doAdminLogin()">Admin Log In</button><p style="text-align:center;margin-top:8px;font-size:12px"><a href="#" onclick="openModal('adminSignup')">Admin Sign Up</a></p></div>
<div id="m-adminSignup" class="hidden"><h2>Admin Sign Up</h2><input id="as-name" placeholder="Admin Name"><input id="as-email" placeholder="Admin Email"><input id="as-pass" type="password" placeholder="Password"><button class="btn btn-primary" style="width:100%;margin-top:8px;background:#111" onclick="doAdminSignup()">Create Admin</button></div>
</div></div>
<script>
let currentUser=JSON.parse(localStorage.getItem('ab_user')||'null');let users=JSON.parse(localStorage.getItem('ab_users')||'[]');let admins=JSON.parse(localStorage.getItem('ab_admins')||'[{"name":"Manuj","email":"venus.artgallery@gmail.com","pass":"admin123"}]');let posts=JSON.parse(localStorage.getItem('ab_posts')||'[{"id":1,"name":"Venus Art Gallery","email":"venus.artgallery@gmail.com","text":"অসমৰ সংস্কৃতি আৰু কলা-কৃষ্টিক AxomBook ত শ্বেয়াৰ কৰক! ❤️","time":"Just now","isAdmin":true}]');
function save(){localStorage.setItem('ab_users',JSON.stringify(users));localStorage.setItem('ab_admins',JSON.stringify(admins));localStorage.setItem('ab_posts',JSON.stringify(posts));localStorage.setItem('ab_user',JSON.stringify(currentUser))}
function openModal(t){document.getElementById('modalBg').classList.remove('hidden');['signup','login','adminLogin','adminSignup'].forEach(k=>document.getElementById('m-'+k).classList.add('hidden'));document.getElementById('m-'+t).classList.remove('hidden')}
function closeModal(){document.getElementById('modalBg').classList.add('hidden')}
function checkLogin(){if(!currentUser){openModal('login');return false}document.getElementById('editor').classList.remove('hidden');return true}
function updateNav(){const l=document.getElementById('loggedUser');if(currentUser){l.classList.remove('hidden');document.getElementById('un').innerText=currentUser.name;document.getElementById('av').innerText=currentUser.name[0];document.getElementById('av2').innerText=currentUser.name[0];document.querySelectorAll('#nav>button').forEach(b=>b.classList.add('hidden'));document.getElementById('postInput').placeholder=`কি ভাবি আছে, ${currentUser.name}?`;document.getElementById('postInput').removeAttribute('readonly')}else{l.classList.add('hidden');document.querySelectorAll('#nav>button').forEach(b=>b.classList.remove('hidden'));document.getElementById('postInput').placeholder='Login কৰক...';document.getElementById('editor').classList.add('hidden')}}
function doSignup(){const n=document.getElementById('s-name').value,e=document.getElementById('s-email').value,p=document.getElementById('s-pass').value;if(!n||!e||!p)return alert('All fields');users.push({name:n,email:e,pass:p});currentUser={name:n,email:e,isAdmin:false};save();closeModal();updateNav();render()}
function doLogin(){const e=document.getElementById('l-email').value,p=document.getElementById('l-pass').value;let u=users.find(u=>u.email==e&&u.pass==p);let a=admins.find(a=>a.email==e&&a.pass==p);if(!u&&!a)return alert('Wrong');currentUser=a?{name:a.name,email:a.email,isAdmin:true}:{name:u.name,email:u.email,isAdmin:false};save();closeModal();updateNav();render()}
function doAdminSignup(){const n=document.getElementById('as-name').value,e=document.getElementById('as-email').value,p=document.getElementById('as-pass').value;admins.push({name:n,email:e,pass:p});save();alert('Admin Created');openModal('adminLogin')}
function doAdminLogin(){const e=document.getElementById('al-email').value,p=document.getElementById('al-pass').value;const a=admins.find(a=>a.email==e&&a.pass==p);if(!a)return alert('Wrong admin');currentUser={name:a.name,email:a.email,isAdmin:true};save();closeModal();updateNav();render()}
function logout(){currentUser=null;save();updateNav();render()}
function createPost(){if(!currentUser)return openModal('login');const t=document.getElementById('postText').value;const f=document.getElementById('postFile').files[0];if(!t&&!f)return;let img='';if(f)img=URL.createObjectURL(f);posts.unshift({id:Date.now(),name:currentUser.name,email:currentUser.email,text:t,img:img,time:'Just now',isAdmin:!!currentUser.isAdmin});save();document.getElementById('postText').value='';document.getElementById('postFile').value='';render()}
function render(){const feed=document.getElementById('feed');feed.innerHTML='';posts.forEach(p=>{const canEdit=currentUser&&(currentUser.email==p.email||currentUser.isAdmin);const div=document.createElement('div');div.className='card';div.innerHTML=`<div class="post-head"><div class="post-user"><div class="avatar">${p.name[0]}</div><div><b>${p.name} ${p.isAdmin?'<span class=badge>ADMIN</span>':''}</b><div style="font-size:12px;color:#65676b">${p.time}</div></div></div><div class="post-menu ${!canEdit?'hidden':''}"><button class="dots" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='block'?'none':'block'">⋯</button><div class="menu"><button onclick="editPost(${p.id})">Edit</button><button onclick="deletePost(${p.id})">Delete</button></div></div></div><div style="margin-top:8px">${p.text||''}</div>${p.img?`<img class="post-img" src="${p.img}">`:''}<div class="actions" style="margin-top:10px"><button>👍 Like</button><button>💬 Comment</button><button>↗️ Share</button></div>`;feed.appendChild(div)})}
function deletePost(id){if(!confirm('Delete?'))return;posts=posts.filter(p=>p.id!=id);save();render()}
function editPost(id){const p=posts.find(x=>x.id==id);const nt=prompt('Edit:',p.text);if(nt!==null){p.text=nt;save();render()}}
updateNav();render();
</script></body></html>
