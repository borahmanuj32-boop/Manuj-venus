<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Art Gallery Teok</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#000;color:#fff;text-align:center;padding:30px 15px;position:sticky;top:0;z-index:100}
.btn{background:#ff0000;color:#fff;padding:10px 22px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block;margin:5px}
.container{max-width:1100px;margin:auto;padding:20px}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 15px #0002}
.card iframe{width:100%;height:380px;border:0}
.info{padding:12px;text-align:center;font-weight:bold}
.pages{text-align:center;margin:30px 0}
.pages button{padding:10px 18px;margin:5px;border:0;background:#000;color:#fff;border-radius:8px;cursor:pointer;font-weight:bold}
.pages button.active{background:#ff0000}
footer{background:#000;color:#aaa;text-align:center;padding:20px;margin-top:30px}
</style>
</head>
<body>

<header>
<h1>VENUS ART GALLERY TEOK 🎨</h1>
<a class="btn" href="https://youtube.com/@venusartgalleryteok8649" target="_blank">🔴 Subscribe</a>
</header>

<div class="container">
<h2>🔥 My Art Videos</h2>
<div id="gallery" class="videos"></div>
<div id="pagination" class="pages"></div>
</div>

<footer>© 2026 Venus Art Gallery Teok</footer>

<script>
// ========================================================
// 👉 STEP 1: নতুন Video আহিলে খালি ইয়াত ID Add কৰক 👈
// ========================================================
const ALL_VIDEOS = [
  "f_y3EKZJyQxoybtgL4", // 1 - আপোনাৰ Video
  "f_Wdrv3jyb0", // 2 - আৰু Video Link দিয়ক
  "f_Wdrv3jyb0", // 3
  "f_Wdrv3jyb0", // 4
  "f_Wdrv3jyb0", // 5
  "f_Wdrv3jyb0", // 6
  "f_Wdrv3jyb0", // 7 - Page 2 ত যাব
  "f_Wdrv3jyb0", // 8
  "f_Wdrv3jyb0", // 9
  "f_Wdrv3jyb0", // 10
  "f_Wdrv3jyb0", // 11
  "f_Wdrv3jyb0"  // 12
"f_y3EKZJyQxoybtgL4"' // 13 - নতুন আহিলে ইয়াত add কৰি যাওক
];
// ========================================================

const perPage = 6;
let currentPage = 1;

function showPage(page){
  currentPage = page;
  const start = (page-1)*perPage;
  const end = start + perPage;
  const pageVideos = ALL_VIDEOS.slice(start,end);
  
  let html = "";
  pageVideos.forEach(id=>{
    html += `<div class="card"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe><div class="info">Art Video 🎨</div></div>`;
  });
  document.getElementById("gallery").innerHTML = html;

  // Pagination buttons
  let totalPages = Math.ceil(ALL_VIDEOS.length/perPage);
  let btns = "";
  for(let i=1;i<=totalPages;i++){
    btns += `<button class="${i===page?'active':''}" onclick="showPage(${i})">${i}</button>`;
  }
  document.getElementById("pagination").innerHTML = btns;
  window.scrollTo(0,0);
}

showPage(1);
</script>
</body>
</html>
