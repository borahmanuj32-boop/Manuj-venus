<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venus Music 2026</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0e0e;color:#fff;font-family:sans-serif}.h{position:sticky;top:0;background:#151515;padding:12px;border-bottom:1px solid #222}.h b{color:#ff2a6d}.btn{background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:6px}.btn-p{background:#ff2a6d;border:0;font-weight:700;width:100%;padding:12px;margin-top:6px;border-radius:8px}.sw{height:200px;margin:12px;border-radius:12px;overflow:hidden;background:#000}.sl{display:flex;height:100%;transition:.5s}.s{min-width:100%;height:100%;background-size:cover;background-position:center}.co{padding:12px}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.cd{background:#181818;border:1px solid #222;border-radius:10px;padding:10px}.cb{width:100%;height:90px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}.cb img{width:100%;height:100%;object-fit:cover}.ap{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}.ap input,.ap select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-size:1rem}.fi{border:2px dashed #ff2a6d!important;padding:20px!important;text-align:center;background:#22151a!important}.ld{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column}.sp{width:50px;height:50px;border:4px solid #333;border-top:4px solid #ff2a6d;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.pl{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #333;padding:14px;display:flex;gap:12px;z-index:20}.pc{width:64px;height:64px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden}.pr{height:6px;background:#333;border-radius:3px;margin-top:8px}.prb{height:100%;background:#ff2a6d;width:0%}.ft{text-align:center;padding:20px;color:#666;font-size:.8rem;margin-bottom:95px;border-top:1px solid #222}.hi{display:none!important}</style></head><body>
<div class="h"><b>🎵 VENUS MUSIC</b> <span id="stt" style="opacity:.6;font-size:.8rem"></span></div>
<div class="sw"><div class="sl" id="sl"></div></div>
<div id="adSlide" class="ap hi"><input id="si" placeholder="Slide Image URL"><input id="sc" placeholder="Caption"><button class="btn-p" onclick="addS()">Save Slide</button><div id="sL"></div></div>
<div class="co"><b>📁 Folders</b> <button class="btn ad hi" onclick="document.getElementById('fBox').classList.toggle('hi')">+ Folder</button>
<div id="fBox" class="ap hi"><input id="fn" placeholder="Folder Name"><input id="fd" placeholder="Desc"><button class="btn-p" onclick="saveF()">Save Folder</button></div><div class="gr" id="fm" style="margin-top:10px"></div><div id="afl"></div>
<div style="margin-top:16px"><b>🎵 Songs</b> <button class="btn ad hi" onclick="document.getElementById('upBox').classList.toggle('hi')">+ Upload</button>
<div id="upBox" class="ap hi">
<input id="st" placeholder="Song Title *"><input id="sar" placeholder="Artist Name"><select id="sf"></select>
<label style="display:block;margin-top:8px;color:#ff2a6d">📱 ফোনৰ পৰা গান Select:</label>
<input type="file" id="sfi" class="fi" accept="audio/*,.mp3,.m4a,.wav,.ogg">
<small style="color:#888">Phone Storage ৰ পৰা - MP3/WAV</small>
<input id="sco" placeholder="pCloud Direct Link বা Cover URL">
<button class="btn-p" onclick="upS()">🎵 Upload + Save</button></div><div class="gr" id="as" style="margin-top:12px"></div></div></div>
<div id="logBox" class="log ap hi" style="margin:12px"><h3 style="color:#ff2a6d;text-align:center">🎵 Admin Login</h3>
<input id="u" placeholder="Username"><div style="position:relative"><input id="p" type="password" placeholder="Password"><span onclick="let x=document.getElementById('p');x.type=x.type=='password'?'text':'password';this.textContent=x.type=='password'?'👁️':'🙈'" style="position:absolute;right:12px;top:14px;cursor:pointer">👁️</span></div>
<button class="btn-p" onclick="login()">Login</button><button class="btn" style="width:100%;margin-top:8px;padding:11px;border-radius:8px" onclick="guest()">Guest হিসাবে চাওক</button></div>
<div class="ft">📞 9101573700 | © Manuj venus 2026<br><br><button id="lb" class="btn-p" style="width:auto;padding:10px 24px" onclick="togLog()">Admin Login</button><button id="lob" class="btn hi" style="width:auto;background:#333;padding:10px 24px;border-radius:8px" onclick="logout()">Logout</button></div>
<div class="ld" id="ld"><div class="sp"></div><p style="margin-top:12px">Uploading <span id="pc">0%</span> 🎵</p></div>
<div class="pl" id="pl" style="display:none"><div class="pc" id="pcb">🎵</div><div style="flex:1"><b id="pt">-</b><br><small id="pa" style="opacity:.6">-</small><div class="pr" onclick="sk(event)"><div class="prb" id="pb"></div></div><div style="display:flex;gap:18px;margin-top:10px;font-size:1.4rem"><span onclick="prv()">⏮️</span><span id="pp" onclick="tg()" style="background:#ff2a6d;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center">▶️</span><span onclick="nxt()">⏭️</span><span onclick="clP()" style="margin-left:auto">✕</span></div></div><audio id="au" ontimeupdate="upd()" onended="nxt()" crossorigin="anonymous"></audio></div>
<script>
let db,cur=null,es=null,ef=null,cf=null,qu=[],qi=0,si2=0;
const PCLOUD_SONG="https://api.pcloud.com/getpublinkdownload?code=kZ7h53VZnTmTV84wfr5yCpFOyd4inFVa7B1X";
function oD(){return new Promise(r=>{let o=indexedDB.open('VM9',1);o.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('sl'))d.createObjectStore('sl',{keyPath:'id'});if(!d.objectStoreNames.contains('fo'))d.createObjectStore('fo',{keyPath:'id'});if(!d.objectStoreNames.contains('so'))d.createObjectStore('so',{keyPath:'id'})};o.onsuccess=e=>{db=e.target.result;r()}})}
function pu(s,d){return new Promise(r=>{let t=db.transaction(s,'readwrite');t.objectStore(s).put(d);t.oncomplete=r})}
function de(s,i){return new Promise(r=>{let t=db.transaction(s,'readwrite');t.objectStore(s).delete(i);t.oncomplete=r})}
function al(s){return new Promise(r=>{let t=db.transaction(s,'readonly');let q=t.objectStore(s).getAll();q.onsuccess=()=>r(q.result||[])})}
const $=i=>document.getElementById(i);
async function init(){await oD();let u=localStorage.getItem('v9');if(u){cur=JSON.parse(u);auT()}else{showLog()};ldA();setInterval(()=>mv(1),4000)}
function showLog(){ $('logBox').classList.remove('hi');}
function togLog(){ $('logBox').classList.toggle('hi'); window.scrollTo(0,document.body.scrollHeight);}
function auT(){let isA=cur&&cur.r=='a';document.querySelectorAll('.ad').forEach(e=>{if(isA)e.classList.remove('hi');else e.classList.add('hi')});if(cur){$('lb').classList.add('hi');$('lob').classList.remove('hi');$('stt').textContent=isA?'Admin':'Guest';$('logBox').classList.add('hi')}else{$('lb').classList.remove('hi');$('lob').classList.add('hi');$('stt').textContent='';}}
window.login=()=>{let u=$('u').value.trim(),p=$('p').value.trim();if(u=='admin'&&p=='1234'){cur={r:'a'};localStorage.setItem('v9',JSON.stringify(cur));auT();rSo();window.scrollTo(0,0)}else alert('Wrong!')}
window.guest=()=>{cur={r:'g'};localStorage.setItem('v9',JSON.stringify(cur));auT();rSo();window.scrollTo(0,0)}
window.logout=()=>{localStorage.removeItem('v9');cur=null;auT();rSo();showLog();togLog()}
function toDirect(url){if(!url)return url;if(url.includes('pcloud.link')&&url.includes('code=')){let c=url.split('code=')[1].split('&')[0];return 'https://api.pcloud.com/getpublinkdownload?code='+c}return url}
async function ldA(){let sl=await al('sl');if(sl.length==0){sl=[{id:1,u:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f',c:'Venus'},{id:2,u:'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4',c:'Hits'},{id:3,u:'https://images.unsplash.com/photo-1514525253161-7a46d19cd819',c:'Music'}];for(let x of sl)await pu('sl',x)}
let so=await al('so');if(so.length==0){await pu('so',{id:1001,t:'My pCloud Song',a:'Venus',f:null,da:PCLOUD_SONG,co:''})}
rS();rF();rSo()}
function cbH(c){if(c&&c.length>10)return '<div class="cb"><img src="'+c+'" onerror="this.parentElement.innerHTML=\'🎵\'"></div>';return '<div class="cb">🎵</div>'}
function rS(){al('sl').then(a=>{let h='';a.forEach(s=>{h+='<div class="s" style="background-image:url('+s.u+')"></div>'});$('sl').innerHTML=h;$('sl').style.transform='translateX(-'+(si2*100)+'%)';let l='';a.forEach(s=>{l+='<div style="display:flex;gap:6px;background:#222;padding:5px;margin:4px 0;border-radius:5px"><img src="'+s.u+'" style="width:30px;height:30px"><small style="flex:1">'+(s.c||'')+'</small><button class="btn ad '+(cur&&cur.r=='a'?'':'hi')+'" onclick="eS('+s.id+')">Edit</button><button class="btn ad '+(cur&&cur.r=='a'?'':'hi')+'" onclick="dS('+s.id+')">Del</button></div>'});$('sL').innerHTML=l})}
window.mv=d=>{al('sl').then(a=>{si2=(si2+d+a.length)%a.length;rS()})}
window.addS=async()=>{let u=$('si').value.trim(),c=$('sc').value.trim();if(!u)return;let id=es||Date.now();await pu('sl',{id:id,u:u,c:c});es=null;$('si').value='';$('sc').value='';rS()}
window.eS=async id=>{let s=(await al('sl')).find(x=>x.id==id);$('si').value=s.u;$('sc').value=s.c;es=id}
window.dS=async id=>{if(confirm('Delete?')){await de('sl',id);rS()}}
function rF(){al('fo').then(async f=>{if(f.length==0){await pu('fo',{id:Date.now(),n:'Assamese',d:'My Songs'});f=await al('fo')}let m='',a='',s='';f.forEach(x=>{m+='<div class="cd" onclick="oF('+x.id+')"><div class="cb">📁</div><b>'+x.n+'</b><br><small>'+(x.d||'')+'</small></div>';a+='<div style="display:flex;gap:6px;background:#222;padding:6px;margin:4px 0;border-radius:5px"><b style="flex:1">📁 '+x.n+'</b><button class="btn ad '+(cur&&cur.r=='a'?'':'hi')+'" onclick="eF('+x.id+')">Edit</button><button class="btn ad '+(cur&&cur.r=='a'?'':'hi')+'" onclick="dF('+x.id+')">Del</button></div>';s+='<option value="'+x.id+'">'+x.n+'</option>'});$('fm').innerHTML=m;$('afl').innerHTML=a;$('sf').innerHTML=s})}
window.saveF=async()=>{let n=$('fn').value.trim(),d=$('fd').value.trim();if(!n)return;let id=ef||Date.now();await pu('fo',{id:id,n:n,d:d});ef=null;$('fn').value='';$('fd').value='';rF()}
window.eF=async id=>{let f=(await al('fo')).find(x=>x.id==id);$('fn').value=f.n;$('fd').value=f.d;ef=id}
window.dF=async id=>{if(confirm('Del?')){await de('fo',id);rF()}}
window.oF=id=>{cf=id;rSo()}
async function rSo(){let so=await al('so');let fo=await al('fo');let fil=cf?so.filter(s=>s.f==cf):so;let h='';fil.forEach(s=>{let fn=(fo.find(f=>f.id==s.f)||{}).n||'';h+='<div class="cd" onclick="plS('+s.id+')">'+cbH(s.co)+'<b>🎵 '+s.t+'</b><br><small>'+(s.a||'')+' '+(fn?'|'+fn:'')+'</small><br><button class="btn ad '+(cur&&cur.r=='a'?'':'hi')+'" onclick="event.stopPropagation();eSo('+s.id+')">Edit</button> <button class="btn ad '+(cur&&cur.r=='a'?'':'hi')+'" onclick="event.stopPropagation();dSo('+s.id+')">Del</button></div>'});$('as').innerHTML=h}
window.upS=async()=>{let t=$('st').value.trim(),a=$('sar').value.trim(),f=$('sf').value,fi=$('sfi').files[0],co=toDirect($('sco').value.trim());if(!t)return alert('Title দিয়ক');if(!fi&&!co)return alert('গান Select কৰক');$('ld').style.display='flex';let p=0;let iv=setInterval(()=>{p+=12;if(p>90)p=90;$('pc').textContent=p+'%'},120);let d='';if(fi){d=await new Promise(r=>{let fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(fi)})}else{d=co}clearInterval(iv);$('pc').textContent='100%';let isLink=d.includes('http');await pu('so',{id:Date.now(),t:t,a:a,f:f?parseInt(f):null,da:d,co:isLink?'':co});setTimeout(()=>{$('ld').style.display='none';$('st').value='';$('sar').value='';$('sfi').value='';$('sco').value='';rSo()},400)}
window.dSo=async id=>{if(confirm('Delete?')){await de('so',id);rSo()}}
window.eSo=async id=>{let s=(await al('so')).find(x=>x.id==id);$('st').value=s.t;$('sar').value=s.a;$('sco').value=s.co;$('upBox').classList.remove('hi');await de('so',id)}
window.plS=async id=>{let so=await al('so');let s=so.find(x=>x.id==id);qu=so;qi=so.findIndex(x=>x.id==id);$('au').src=s.da;$('pt').textContent=s.t;$('pa').textContent=s.a||'';$('pcb').innerHTML='🎵';$('pl').style.display='flex';$('au').play().catch(e=>alert('Play Error - pCloud Link Check কৰক'));$('pp').textContent='⏸️'}
window.tg=()=>{let a=$('au');if(a.paused){a.play();$('pp').textContent='⏸️'}else{a.pause();$('pp').textContent='▶️'}}
window.nxt=()=>{if(!qu.length)return;qi=(qi+1)%qu.length;plS(qu[qi].id)}
window.prv=()=>{if(!qu.length)return;qi=(qi-1+qu.length)%qu.length;plS(qu[qi].id)}
window.upd=()=>{let a=$('au');let p=(a.currentTime/a.duration)*100;if(!isNaN(p))$('pb').style.width=p+'%'}
window.sk=e=>{let r=e.currentTarget.getBoundingClientRect();let p=(e.clientX-r.left)/r.width;$('au').currentTime=p*$('au').duration}
window.clP=()=>{$('pl').style.display='none';$('au').pause()}
init();
</script></body></html>
