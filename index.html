<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxomBook - অসমৰ Facebook</title>
<style>
:root{--primary:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#050505}
.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:var(--text)}
header{background:var(--primary);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:22px}
.container{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 2fr 1fr;gap:15px;padding:15px}
.card{background:var(--card);padding:15px;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,0.2);margin-bottom:15px}
textarea{width:100%;border:1px solid #ddd;border-radius:20px;padding:12px;resize:none}
button{background:var(--primary);color:#fff;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;font-weight:bold}
.post img{width:100%;border-radius:10px;margin-top:10px}
.actions{display:flex;justify-content:space-around;border-top:1px solid #ddd;margin-top:10px;padding-top:8px}
.actions span{cursor:pointer}
#loginPage{height:100vh;display:flex;justify-content:center;align-items:center;background:var(--bg)}
.loginBox{background:var(--card);padding:30px;border-radius:10px;width:350px;text-align:center}
.loginBox input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.hidden{display:none}
@media(max-width:700px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="loginBox card">
    <h1 style="color:var(--primary);font-size:35px">AxomBook 📘</h1>
    <p>অসমৰ নিজৰ Facebook</p>
    <input id="email" placeholder="Email / Gmail">
    <input id="pass" type="password" placeholder="Password">
    <button id="loginBtn" style="width:100%;margin-top:10px">Log In</button>
    <button id="signupBtn" style="width:100%;margin-top:8px;background:#42b72a">Create New Account</button>
    <p style="margin-top:10px;font-size:12px">Dark Mode: <span id="darkToggle" style="cursor:pointer">🌙</span> | Lang: <span id="langToggle" style="cursor:pointer">EN/অসমীয়া</span></p>
    <p id="loginMsg" style="color:red;margin-top:10px"></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
<header>
  <h1>AxomBook</h1>
  <div>
    <span id="bell">🔔<b id="notifCount">3</b></span> &nbsp;
    <span id="profileBtn">👤 Profile</span> &nbsp;
    <button id="logoutBtn" style="background:#fff;color:var(--primary)">Logout</button>
  </div>
</header>

<div class="container">
  <!-- LEFT -->
  <div>
    <div class="card">
      <b id="userName">Manuj Borah</b><br>
      <small id="userEmail">borahmanuj32@gmail.com</small>
      <hr style="margin:10px 0">
      <p>👥 Friends <b id="friendCount">128</b></p>
      <p>📸 My Posts</p>
      <p>🔖 Saved</p>
    </div>
    <div class="card">
      <b>Search User</b>
      <input id="searchInput" placeholder="নাম লিখক..." style="width:100%;padding:8px;margin-top:5px;border-radius:20px;border:1px solid #ddd">
      <div id="searchResult" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- FEED -->
  <div>
    <div class="card post-box">
      <textarea id="postInput" placeholder="কি ভাবি আছে, প্ৰভু?"></textarea>
      <input type="file" id="photoInput" accept="image/*,video/*" style="margin-top:10px">
      <div style="margin-top:10px;display:flex;justify-content:space-between">
        <span>📷 Photo | 🎥 Video | 😊 Feeling</span>
        <button id="postBtn">Post</button>
      </div>
    </div>

    <div id="feed"></div>
  </div>

  <!-- RIGHT - PROFILE / CHAT -->
  <div>
    <div class="card" id="profileCard">
      <b>Profile Page Design</b>
      <img id="profilePic" src="https://i.pravatar.cc/200" style="width:80px;height:80px;border-radius:50%;margin:10px 0">
      <input type="file" id="profilePicInput" accept="image/*"><br>
      <img id="coverPic" src="https://picsum.photos/300/100" style="width:100%;border-radius:10px;margin:5px 0">
      <input type="file" id="coverInput" accept="image/*"><br>
      <textarea id="bioInput" placeholder="Bio লিখক... Joi Ai Axom ❤️"></textarea>
      <button id="saveProfile">Save Profile</button>
      <div style="margin-top:10px">
        <b>Chat (Messenger)</b>
        <div id="chatBox" style="height:150px;overflow:auto;border:1px solid #ddd;padding:5px;margin-top:5px;border-radius:8px"></div>
        <input id="chatInput" placeholder="Message..." style="width:70%;padding:6px;border-radius:15px;border:1px solid #ddd">
        <button id="chatSend">Send</button>
        <small id="chatStatus">🟢 Online</small>
      </div>
    </div>
  </div>
</div>
</div>

<script type="module">
// ===== CONFIG - Firebase লগালে ইয়াত Key দিব =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};
// =================================================

let currentUser = JSON.parse(localStorage.getItem('axom_user') || 'null');
const $ = id=>document.getElementById(id);

// DARK MODE
$('darkToggle').onclick=()=>document.body.classList.toggle('dark');
let asLang=true;
$('langToggle').onclick=()=>{asLang=!asLang; $('postInput').placeholder=asLang?'কি ভাবি আছে, প্ৰভু?':'Whats on your mind?'};

// LOGIN SYSTEM - Phase 2
function showApp(){
  $('loginPage').classList.add('hidden');
  $('mainApp').classList.remove('hidden');
  if(currentUser){$('userName').innerText=currentUser.email.split('@')[0]; $('userEmail').innerText=currentUser.email;}
  loadPosts();
}
if(currentUser) showApp();

$('loginBtn').onclick=()=>{
  const e=$('email').value, p=$('pass').value;
  if(!e||!p) return $('loginMsg').innerText='Email Password দিয়ক!';
  // Firebase থাকিলে: signInWithEmailAndPassword(auth,e,p)
  localStorage.setItem('axom_user',JSON.stringify({email:e}));
  currentUser={email:e}; showApp();
};
$('signupBtn').onclick=()=>{$('loginBtn').click(); $('loginMsg').innerText='Account Created! (Firebase লগালে Real হব)';};
$('logoutBtn').onclick=()=>{localStorage.removeItem('axom_user'); location.reload();};

// POST SYSTEM
let posts = JSON.parse(localStorage.getItem('axom_posts')||'[]');
function loadPosts(){
  $('feed').innerHTML='';
  posts.slice().reverse().forEach((post,i)=>{
    const div=document.createElement('div');
    div.className='card post';
    div.innerHTML=`
      <b>${post.user}</b> <small>${post.time}</small>
      <p>${post.text}</p>
      ${post.img?`<img src="${post.img}">`:''}
      <div class="actions">
        <span onclick="likePost(${posts.length-1-i})">❤️ ${post.likes} Like | 😂 | 😮 | 😢 | 😡 | 🥰 | Love</span>
        <span>💬 ${post.comments.length} Comment</span>
        <span onclick="navigator.clipboard.writeText(location.href)">↗️ Share</span>
        <span onclick="deletePost(${posts.length-1-i})">🗑️ Delete</span>
      </div>
      <div><input placeholder="Comment..." onkeydown="if(event.key==='Enter')addComment(${posts.length-1-i},this)"></div>
      <div>${post.comments.map(c=>`<small>💬 ${c}</small><br>`).join('')}</div>
    `;
    $('feed').appendChild(div);
  });
}
$('postBtn').onclick=()=>{
  const text=$('postInput').value;
  const file=$('photoInput').files[0];
  if(!text &&!file) return alert('কিবা লিখক বা Photo দিয়ক!');
  let img='';
  if(file) img=URL.createObjectURL(file);
  posts.push({user:$('userName').innerText,text,img,likes:0,comments:[],time:new Date().toLocaleString()});
  localStorage.setItem('axom_posts',JSON.stringify(posts));
  $('postInput').value=''; loadPosts();
  $('bell').innerText='🔔3'; // Notification
};
window.deletePost=(i)=>{posts.splice(i,1);localStorage.setItem('axom_posts',JSON.stringify(posts));loadPosts();};
window.likePost=(i)=>{posts[i].likes++;localStorage.setItem('axom_posts',JSON.stringify(posts));loadPosts();};
window.addComment=(i,el)=>{posts[i].comments.push(el.value);el.value='';localStorage.setItem('axom_posts',JSON.stringify(posts));loadPosts();};

// PROFILE
$('saveProfile').onclick=()=>{alert('Profile Saved! Bio: '+$('bioInput').value+' (Firebase লগালে সকলোৱে দেখিব)');};
$('profilePicInput').onchange=e=>{$('profilePic').src=URL.createObjectURL(e.target.files[0])};
$('coverInput').onchange=e=>{$('coverPic').src=URL.createObjectURL(e.target.files[0])};

// SEARCH & FRIEND
$('searchInput').oninput=()=>{
  const v=$('searchInput').value;
  if(!v) return $('searchResult').innerHTML='';
  $('searchResult').innerHTML=`<p>${v} - User Found! <button onclick="this.innerText='Request Sent'">+ Friend Request</button> <button>Follow</button></p>`;
};

// CHAT
$('chatSend').onclick=()=>{
  const t=$('chatInput').value; if(!t) return;
  $('chatBox').innerHTML+=`<p><b>You:</b> ${t} <small>✓✓ Seen</small></p>`;
  $('chatInput').value='';
  setTimeout(()=>{$('chatBox').innerHTML+=`<p><b>Friend:</b> Joi Axom! ❤️</p>`; $('chatBox').scrollTop=9999;},800);
};

console.log('AxomBook PRO Loaded - 35 Features Ready');
</script>
</body>
  </html>
