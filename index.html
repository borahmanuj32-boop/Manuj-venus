<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuj & Venus - Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;overflow-x:hidden}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 50%,#2a0a1a,#000);position:relative}
.hero h1{font-family:'Great Vibes',cursive;font-size:5rem;color:#ff4d88;text-shadow:0 0 20px #ff4d88}
.hero p{letter-spacing:5px;margin:20px 0;opacity:.8}
.btn{display:inline-block;padding:14px 40px;border:1px solid #ff4d88;border-radius:50px;color:#ff4d88;text-decoration:none;transition:.3s;margin-top:20px}
.btn:hover{background:#ff4d88;color:#fff;box-shadow:0 0 30px #ff4d88}
.hearts{position:absolute;width:100%;height:100%;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;animation:float 6s infinite;color:#ff4d88;opacity:.3}
@keyframes float{0%{transform:translateY(100vh) scale(0)}100%{transform:translateY(-10vh) scale(1.5)}}
</style>
</head>
<body>
<div class="hero">
<div class="hearts">
<span style="left:10%;animation-delay:0s">❤️</span>
<span style="left:30%;animation-delay:1s">💖</span>
<span style="left:70%;animation-delay:2s">❤️</span>
<span style="left:90%;animation-delay:3s">💖</span>
</div>
<div>
<h1>Manuj & Venus</h1>
<p>OUR LOVE STORY</p>
<a href="gallery.html" class="btn">Enter Gallery →</a>
</div>
</div>
</body>
</html>
