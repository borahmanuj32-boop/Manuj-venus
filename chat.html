<!DOCTYPE html><html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxomWhatsApp</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#111b21;height:100vh;display:flex}
.login{position:fixed;inset:0;background:#111b21;z-index:99;display:flex;align-items:center;justify-content:center}
.card{background:#fff;padding:24px;border-radius:12px;width:90%;max-width:360px;text-align:center}
.card input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.card button{width:100%;padding:12px;background:#25d366;color:#fff;border:none;border-radius:8px;font-weight:700}
.side{width:35%;min-width:320px;background:#fff;display:flex;flex-direction:column}
.main{flex:1;background:#e5ddd5;display:flex;flex-direction:column}
.top{background:#008069;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.list{flex:1;overflow:auto}
.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.item img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.wall{flex:1;overflow:auto;padding:12px;background:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bubble{max-width:70%;padding:8px 10px;border-radius:8px;margin:5px 0;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.me{background:#d9fdd3;margin-left:auto}.other{background:#fff}
.bar{background:#f0f2f5;padding:8px;display:flex;gap:8px;align-items:center}
.bar input{flex:1;padding:11px;border-radius:22px;border:none;outline:none}
.send{background:#008069;color:#fff;border:none;width:44px;height:44px;border-radius:50%}
@media(max-width:800px){.side{width:100%}.main{display:none}.main.open{display:flex;position:fixed;inset:0;z-index:5}}
</style></head><body>
<div class="login" id="login"><div class="card">
<h2>AxomWhatsApp 🟢</h2><p style="opacity:.6;font-size:.9rem">Phone ৰে Login কৰক</p>
<input id="ph" type="tel" placeholder="Phone: 9101573700">
<input id="nm" placeholder="আপোনাৰ নাম">
<input id="pic" type="file" accept="image/*">
<button onclick="doLogin()">WhatsApp খোলক ➤</button>
<p style="font-size:.7rem;margin-top:10px">OTP 1234 Auto Verify</p>
</div></div>

<div class="side"><div class="top"><b>AxomWhatsApp</b><span style="margin-left:auto">🔍 ⋮</span></div>
<div style="padding:8px;background:#fff"><input id="srch" placeholder="Search..." style="width:100%;padding:10px;background:#f0f2f5;border:none;border-radius:8px"></div>
<div class="list" id="list"></div>
<div style="padding:8px;text-align:center"><a href="axombook.html" style="text-decoration:none">← AxomBook</a></div>
</div>

<div class="main" id="main"><div class="top" id="cTop" style="display:none"><span onclick="document.getElementById('main').classList.remove('open')" style="cursor:pointer;font-size:1.5rem">←</span><img id="cPic" src="" style="width:40px;height:40px;border-radius:50%"><div><b id="cName"></b><br><small id="cOn">online</small></div><div style="margin-left:auto">📞 🎥 ⋮</div></div>
<div class="wall" id="wall"><div style="text-align:center;margin-top:30%;opacity:.5">Select Chat to Start 🟢</div></div>
<div class="bar" id="bar" style="display:none"><label style="font-size:1.4rem;cursor:pointer">📎<input type="file" id="fIn" accept="image/*,video/*" hidden></label><input id="mIn" placeholder="Message"><button class="send" id="sBtn">➤</button></div>
</div>

<script>
let db,cur=null,to=null;
function oDB(){return new Promise(r=>{let o=indexedDB.open('AxomWA',2);o.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('wUsers'))d.createObjectStore('wUsers',{keyPath:'phone'});if(!d.objectStoreNames.contains('wMsgs'))d.createObjectStore('wMsgs',{keyPath:'id'});};o.onsuccess=e=>{db=e.target.result;r();}});}
function put(s,d){return new Promise(r=>{let t=db.transaction(s,'readwrite');t.objectStore(s).put(d);t.oncomplete=r;})}
function all(s){return new Promise(r=>{let t=db.transaction(s,'readonly');let q=t.objectStore(s).getAll();q.onsuccess=()=>r(q.result||[]);})}
const $=id=>document.getElementById(id);
async function init(){await oDB();let p=localStorage.getItem('wa_cur');if(p){cur=JSON.parse(p);$('login').style.display='none';loadList();}}
window.doLogin=async()=>{
let ph=$('ph').value.trim(),nm=$('nm').value.trim();
if(ph.length<10||!nm)return alert('Phone + Name দিয়ক');
let pic='https://via.placeholder.com/100';let f=$('pic').files[0];
if(f){pic=await new Promise(r=>{let fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(f);});}
let u={phone:ph,name:nm,pic:pic};await put('wUsers',u);localStorage.setItem('wa_cur',JSON.stringify(u));cur=u;$('login').style.display='none';loadList();
};
async function loadList(){
let users=await all('wUsers');let ms=await all('wMsgs');
let others=users.filter(u=>u.phone!==cur.phone);
let h='';for(let u of others){let last=ms.filter(m=>(m.from===cur.phone&&m.to===u.phone)||(m.from===u.phone&&m.to===cur.phone)).sort((a,b)=>b.time-a.time)[0];
h+='<div class=item onclick="openC(\''+u.phone+'\')"><img src="'+u.pic+'"><div style="flex:1"><b>'+u.name+'</b><br><small style="opacity:.6">'+(last?last.txt.substring(0,25):'Tap to chat')+'</small></div><small>'+u.phone+'</small></div>';}
$('list').innerHTML=h||'<div style="padding:20px;opacity:.5;text-align:center">কোনো Contact নাই - বেলেগ Phone ৰে Login কৰক</div>';
}
window.openC=async(ph)=>{
let users=await all('wUsers');let u=users.find(x=>x.phone===ph);to=u;
$('cTop').style.display='flex';$('bar').style.display='flex';$('main').classList.add('open');$('cName').textContent=u.name;$('cPic').src=u.pic;loadChat();
};
async function loadChat(){
let ms=await all('wMsgs');let f=ms.filter(m=>(m.from===cur.phone&&m.to===to.phone)||(m.from===to.phone&&m.to===cur.phone)).sort((a,b)=>a.time-b.time);
let h='';for(let m of f){let me=m.from===cur.phone;let t=new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
if(m.type==='img')h+='<div class="bubble '+(me?'me':'other')+'"><img src="'+m.txt+'" style="max-width:100%;border-radius:8px"><div style="font-size:.7rem;text-align:right;opacity:.6">'+t+' ✓✓</div></div>';
else if(m.type==='video')h+='<div class="bubble '+(me?'me':'other')+'"><video src="'+m.txt+'" controls style="max-width:100%;border-radius:8px"></video><div style="font-size:.7rem;text-align:right;opacity:.6">'+t+' ✓✓</div></div>';
else h+='<div class="bubble '+(me?'me':'other')+'"><div>'+m.txt+'</div><div style="font-size:.65rem;text-align:right;opacity:.6">'+t+' ✓✓</div></div>';
}
$('wall').innerHTML=h||'<div style="text-align:center;opacity:.5">No messages - Hi 👋</div>';$('wall').scrollTop=$('wall').scrollHeight;
}
$('sBtn').onclick=async()=>{let txt=$('mIn').value.trim();if(!txt||!to)return;await put('wMsgs',{id:Date.now()+Math.random(),from:cur.phone,to:to.phone,txt:txt,type:'text',time:Date.now()});$('mIn').value='';loadChat();loadList();};
$('fIn').onchange=async e=>{let file=e.target.files[0];if(!file||!to)return;let url=await new Promise(r=>{let fr=new FileReader();fr.onload=x=>r(x.target.result);fr.readAsDataURL(file);});let tp=file.type.startsWith('video')?'video':'img';await put('wMsgs',{id:Date.now()+Math.random(),from:cur.phone,to:to.phone,txt:url,type:tp,time:Date.now()});loadChat();};
init();
</script></body></html>
