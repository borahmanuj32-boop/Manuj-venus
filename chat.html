<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AxomBook Chat - WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#111b21;height:100vh;overflow:hidden;display:flex}
.side{width:35%;min-width:320px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
.main{flex:1;background:#e5ddd5;display:flex;flex-direction:column;position:relative}
.top{background:#f0f2f5;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top-green{background:#008069;color:#fff}
.search{padding:8px 12px;background:#fff;border-bottom:1px solid #f0f2f5}
.search input{width:100%;padding:10px 14px;border-radius:8px;border:none;background:#f0f2f5;outline:none}
.list{flex:1;overflow:auto}
.chat-item{display:flex;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;align-items:center}
.chat-item:hover{background:#f5f6f6}
.chat-item.active{background:#f0f2f5}
.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name{font-weight:600;font-size:.95rem;display:flex;justify-content:space-between}
.chat-last{font-size:.85rem;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badge{background:#25d366;color:#fff;border-radius:50%;padding:2px 7px;font-size:.7rem}
.wall{flex:1;overflow:auto;padding:20px;background:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-size:400px}
.bubble{max-width:65%;padding:8px 10px;border-radius:8px;margin:6px 0;box-shadow:0 1px 0.5px rgba(0,0,0,.13);position:relative}
.me{background:#d9fdd3;margin-left:auto;border-radius:8px 0 8px 8px}
.other{background:#fff;margin-right:auto;border-radius:0 8px 8px 8px}
.time{font-size:.65rem;opacity:.6;text-align:right;margin-top:4px}
.input-bar{background:#f0f2f5;padding:8px 12px;display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;padding:12px 16px;border-radius:8px;border:none;outline:none}
.send{width:44px;height:44px;border-radius:50%;background:#008069;color:#fff;border:none;font-size:1.3rem;cursor:pointer}
.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem}
@media(max-width:800px){.side{width:100%}.main{display:none}.main.open{display:flex;position:fixed;inset:0;z-index:10}}
</style>
</head>
<body>
<div class="side" id="side">
<div class="top top-green">
<b style="font-size:1.2rem">AxomChat 🟢</b>
<div style="margin-left:auto;display:flex;gap:14px">🔍 ⋮</div>
</div>
<div class="top" style="gap:8px;background:#fff">
<button class="icon" onclick="location.href='axombook.html'">←</button>
<img id="myPic" src="https://via.placeholder.com/40" style="width:40px;height:40px;border-radius:50%">
<b id="myName">Guest</b>
<span style="margin-left:auto">📷 ➕</span>
</div>
<div class="search"><input id="search" placeholder="Search or start new chat"></div>
<div class="list" id="chatList"></div>
<div style="padding:10px;text-align:center;font-size:.8rem;opacity:.6">📞 9101573700 | Manuj Venus 2026 | <a href="axombook.html">Back to AxomBook</a></div>
</div>
<div class="main" id="main">
<div class="top top-green" id="chatTop" style="display:none">
<button class="icon" onclick="closeChat()" style="color:#fff">←</button>
<img id="cPic" src="https://via.placeholder.com/40" style="width:40px;height:40px;border-radius:50%">
<div><b id="cName"></b><br><small id="cStatus" style="opacity:.8">online</small></div>
<div style="margin-left:auto;display:flex;gap:14px">📞 🎥 ⋮</div>
</div>
<div class="wall" id="wall">
<div style="text-align:center;margin-top:30%;opacity:.5">
<h2>AxomBook WhatsApp 📘🟢</h2>
<p>Select a chat to start messaging</p>
<p style="margin-top:10px">🔒 End-to-end encrypted (Local)</p>
</div>
</div>
<div class="input-bar" id="inputBar" style="display:none">
<span class="icon">😊</span><span class="icon">📎</span>
<input id="mIn" placeholder="Type a message">
<button class="send" id="mSend">➤</button>
</div>
</div>
<script>
let db,curChat=null;
function openDB(){return new Promise(r=>{let o=indexedDB.open('AxomFinalPRO',3);o.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('posts'))d.createObjectStore('posts',{keyPath:'id'});if(!d.objectStoreNames.contains('msgs'))d.createObjectStore('msgs',{keyPath:'id'});};o.onsuccess=e=>{db=e.target.result;r();};});}
function add(s,d){return new Promise(res=>{let t=db.transaction(s,'readwrite');t.objectStore(s).put(d);t.oncomplete=res;});}
function getAll(s){return new Promise(res=>{let t=db.transaction(s,'readonly');let q=t.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);});}
const getU=()=>JSON.parse(localStorage.getItem('ab_users')||'[]');
const logged=()=>!!localStorage.getItem('ab_cur');
const $=id=>document.getElementById(id);
async function init(){
await openDB();
let cur=JSON.parse(localStorage.getItem('ab_cur')||'null');
if(!cur){alert('Login First in AxomBook');location.href='axombook.html';return;}
let me=getU().find(u=>u.email===cur.email);
$('myName').textContent=me.username;
$('myPic').src=me.pic||'https://via.placeholder.com/40';
loadContacts();
}
async function loadContacts(){
let users=getU();
let cur=JSON.parse(localStorage.getItem('ab_cur')).email;
let msgs=await getAll('msgs');
let others=users.filter(u=>u.email!==cur);
let html='';
for(let u of others){
let chatMsgs=msgs.filter(m=>(m.from===cur&&m.to===u.email)||(m.from===u.email&&m.to===cur));
let last=chatMsgs.sort((a,b)=>b.time-a.time)[0];
let lastTxt=last?last.txt:'Tap to chat';
let unread=chatMsgs.filter(m=>m.to===cur).length;
html+='<div class="chat-item" onclick="openChat(\''+u.email+'\',\''+u.username+'\',\''+(u.pic||'https://via.placeholder.com/49')+'\')">';
html+='<img src="'+(u.pic||'https://via.placeholder.com/49')+'" class="avatar">';
html+='<div class="chat-info"><div class="chat-name"><span>'+u.username+'</span><small style="opacity:.5;font-size:.75rem">'+(last?new Date(last.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'')+'</small></div>';
html+='<div class="chat-last">'+lastTxt+'</div></div>';
if(unread>0)html+='<span class="badge">'+unread+'</span>';
html+='</div>';
}
$('chatList').innerHTML=html||'<div style="padding:20px;text-align:center;opacity:.6">No Contacts - Create accounts in AxomBook</div>';
$('search').oninput=e=>{
let q=e.target.value.toLowerCase();
document.querySelectorAll('.chat-item').forEach(it=>{
it.style.display=it.textContent.toLowerCase().includes(q)?'flex':'none';
});
};
}
window.openChat=async(email,name,pic)=>{
curChat=email;
$('chatTop').style.display='flex';
$('inputBar').style.display='flex';
$('cName').textContent=name;
$('cPic').src=pic;
$('main').classList.add('open');
loadMessages();
};
window.closeChat=()=>{$('main').classList.remove('open');curChat=null;};
async function loadMessages(){
if(!curChat)return;
let msgs=await getAll('msgs');
let cur=JSON.parse(localStorage.getItem('ab_cur')).email;
let f=msgs.filter(m=>(m.from===cur&&m.to===curChat)||(m.from===curChat&&m.to===cur)).sort((a,b)=>a.time-b.time);
let h='';
let date='';
for(let m of f){
let d=new Date(m.time).toDateString();
if(d!==date){date=d;h+='<div style="text-align:center;margin:10px"><span style="background:#fff;padding:4px 10px;border-radius:8px;font-size:.75rem;box-shadow:0 1px 1px rgba(0,0,0,.1)">'+d+'</span></div>';}
let isMe=m.from===cur;
let time=new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
h+='<div class="bubble '+(isMe?'me':'other')+'"><div style="font-size:.9rem">'+m.txt+'</div><div class="time">'+time+' '+(isMe?'✓✓':'')+'</div></div>';
}
$('wall').innerHTML=h||'<div style="text-align:center;opacity:.5;margin-top:20%">No messages yet. Say Hi! 👋</div>';
$('wall').scrollTop=$('wall').scrollHeight;
}
$('mSend').onclick=async()=>{
let t=$('mIn').value.trim();
if(!t||!curChat)return;
let cur=JSON.parse(localStorage.getItem('ab_cur')).email;
await add('msgs',{id:Date.now()+Math.random(),from:cur,to:curChat,txt:t,time:Date.now()});
$('mIn').value='';
loadMessages();
loadContacts();
};
$('mIn').onkeypress=e=>{if(e.key==='Enter')$('mSend').click();};
init();
</script>
</body>
</html>
