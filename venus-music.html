<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venus Music Studio - Manuj 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;overflow:hidden}
:root{--p:#ff2a6d;--p2:#05d9e8}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f0f,#1a1a2e);z-index:100;display:flex;align-items:center;justify-content:center}
.card{background:#1a1a1a;padding:32px;border-radius:16px;width:90%;max-width:380px;border:1px solid #333;text-align:center}
.card input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
.card button{width:100%;padding:12px;background:var(--p);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
.eye{position:relative}.eye i{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#888}
.app{display:flex;height:100vh}
.left{width:240px;background:#121212;border-right:1px solid #222;display:flex;flex-direction:column;padding:12px;overflow:auto}
.menu-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin:3px 0;display:flex;gap:10px;color:#aaa}
.menu-item.active{background:#222;color:#fff}
.cover-box{width:100%;height:110px;border-radius:8px;background:linear-gradient(135deg,#222,#333);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--p)}
.cover-box img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.player{position:fixed;bottom:0;left:240px;right:0;background:#181818;border-top:1px solid #333;padding:10px 16px;display:flex;align-items:center;gap:14px;z-index:50}
.p-cover{width:48px;height:48px;border-radius:6px;background:linear-gradient(135deg,#222,#444);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--p);overflow:hidden}
.exit-btn{background:#ff0000!important;color:#fff;padding:6px 14px;border-radius:20px;font-weight:700}
</style>
</head>
<body>
