<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VENUS Upload - Secret</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:system-ui;padding:15px;max-width:500px;margin:0 auto}
.box{background:#18181f;border:1px solid #252530;border-radius:18px;padding:18px;margin-top:20px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}
.btn{background:#ff4d88;border:0;color:#fff;width:100%;padding:13px;border-radius:12px;font-weight:800;margin-top:10px}
.arch{height:12px;background:#222;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0%;background:#ff4d88;transition:.3s}
.card{display:flex;gap:10px;background:#111;border:1px solid #222;padding:8px;border-radius:12px;margin:8px 0;align-items:center}
.card img{width:60px;height:60px;border-radius:8px;object-fit:cover}
</style></head><body>
<h2 style="color:#ff4d88;text-align:center;margin-top:10px">👑 VENUS SECRET UPLOAD</h2>
<p style="text-align:center;opacity:.5;font-size:12px">ইয়াত Upload কৰিলে Public Page ত দেখাব</p>
<div class="box">
<input type="file" id="file" accept="image/*">
<input id="name" placeholder="Name - Ex: Red T-Shirt">
<input id="price" placeholder="Price - Ex: 499">
<div class="arch" id="archWrap" style="display:none"><div class="fill" id="fill"></div></div>
<div id="txt" style="text-align:center;color:#ff4d88;font-size:13px"></div>
<button class="btn" id="btn" onclick="up()">🚀 Upload to Venus</button>
</div>
<div id="list"></div>
<button class="btn" style="background:#222;margin-top:15px" onclick="location.href='index.html'">🏠 Public Page চাওক</button>
<script>
let db; let r=indexedDB.open('VenusDB',1);
r.onupgradeneeded=e=>{e.target.result.createObjectStore('products',{keyPath:'id',autoIncrement:true})};
r.onsuccess=e=>{db=e.target.result; load();};

function up(){
 let f=file.files[0]; if(!f) return alert('Photo select কৰক');
 txt.innerText='Compressing...'; archWrap.style.display='block'; btn.disabled=true; fill.style.width='30%';
 let rd=new FileReader();
 rd.onload=e=>{
  let img=new Image();
  img.onload=()=>{
   let c=document.createElement('canvas'); let max=600; let w=img.width,h=img.height;
   if(w>max||h>max){if(w>h){h*=max/w;w=max}else{w*=max/h;h=max}}
   c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   fill.style.width='70%'; txt.innerText='Saving...';
   let comp=c.toDataURL('image/jpeg',0.5);
   let tx=db.transaction('products','readwrite');
   tx.objectStore('products').add({name:name.value||'Venus',price:price.value||'00',photo:comp});
   tx.oncomplete=()=>{fill.style.width='100%'; txt.innerText='✅ Done!'; btn.disabled=false; file.value=''; load(); setTimeout(()=>{archWrap.style.display='none'},1000);};
  }; img.src=e.target.result;
 }; rd.readAsDataURL(f);
}
function load(){
 if(!db) return; db.transaction('products').objectStore('products').getAll().onsuccess=e=>{
  let pr=e.target.result||[]; let h=''; [...pr].reverse().forEach(p=>{h+=`<div class="card"><img src="${p.photo}"><div style="flex:1"><b>${p.name}</b><br><span style="color:#ff4d88">₹${p.price}</span></div><button onclick="del(${p.id})" style="background:#ff4d8820;color:#ff4d88;border:0;padding:6px 10px;border-radius:8px">X</button></div>`});
  list.innerHTML=h;
 };
}
function del(id){db.transaction('products','readwrite').objectStore('products').delete(id).onsuccess=load;}
</script></body></html>
