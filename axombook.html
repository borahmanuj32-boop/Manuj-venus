<!DOCTYPE html><html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AxomBook PRO Facebook 📘</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;font-family:'Poppins',sans-serif}
.header{background:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo{color:#0866ff;font-weight:800;font-size:1.8rem}.btn{padding:8px 14px;border-radius:18px;border:none;cursor:pointer;font-weight:600}.btn-blue{background:#0866ff;color:#fff}
.layout{display:flex;max-width:1200px;margin:auto}.left{width:250px;padding:10px}.center{flex:1;max-width:600px;padding:10px}.right{width:260px;padding:10px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.menu{padding:10px;border-radius:8px;cursor:pointer;margin:4px 0}.menu:hover{background:#f0f2f5}
.input{width:100%;padding:10px;border-radius:20px;border:none;background:#f0f2f5;outline:none;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;padding:10px}
.modal.active{display:flex}.box{background:#fff;padding:18px;border-radius:12px;width:100%;max-width:450px;max-height:90vh;overflow:auto}
.hide{display:none}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer}
.footer{text-align:center;padding:12px;background:#fff;border-radius:10px;margin-top:10px;opacity:.7}
@media(max-width:800px){.left,.right{display:none}.center{max-width:100%}}
</style></head><body>
<div class="header"><div class="logo">AxomBook 📘</div><div style="display:flex;gap:8px;align-items:center"><span id="topName"></span><button id="loginBtn" class="btn btn-blue">Login</button><button id="logoutBtn" class="btn hide">SignOut</button></div></div>
<div class="layout">
<div class="left">
<div class="card"><b id="leftName">Guest</b><p id="leftBio" style="font-size:.8rem;opacity:.6">Bio</p><button id="editProfBtn" class="btn btn-blue" style="width:100%;margin-top:8px">✏️ Edit Profile</button></div>
<div class="menu" onclick="showPage('home')">🏠 Home</div>
<div class="menu" onclick="showPage('friends')">👥 Friends / Add Friend</div>
<div class="menu" onclick="showPage('photos')">🖼️ Photos Unlimited ♾️ <small id="pc"></small></div>
<div class="menu" onclick="showPage('reels')">🎬 Reels Video <small id="rc"></small></div>
<div class="menu">📁 Functions: Photo, Reel, Friend, Message, Contact, Address</div>
</div>
<div class="center">
<div class="card"><textarea id="postText" class="input" placeholder="কি ভাবি আছে?" style="border-radius:12px"></textarea>
<input type="file" id="pPhoto" accept="image/*" multiple style="margin:6px 0;width:100%"><small>♾️ Unlimited Photo - 10 টা</small>
<input type="file" id="pReel" accept="video/*" style="margin:6px 0;width:100%"><small>🎬 Reel Video Upload</small>
<div id="prog" class="hide" style="text-align:center"><div style="border:3px solid #eee;border-top:3px solid #0866ff;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;margin:auto"></div><p>Uploading...</p></div>
<button id="postBtn" class="btn btn-blue" style="width:100%;padding:12px;margin-top:8px">📘 Post কৰক</button></div>
<div id="feed"></div>
</div>
<div class="right">
<div class="card"><b>👥 Friend Requests</b><div id="reqList"></div></div>
<div class="card"><b>💬 Contacts / Message</b><div id="cList"></div></div>
<div class="card"><b>📞 Contact Form</b><input id="cPhone" class="input" placeholder="Phone"><input id="cAddr" class="input" placeholder="Address"><button id="saveC" class="btn btn-blue" style="width:100%">Save</button></div>
<div class="footer">📞 9101573700<br>© Manuj Venus 2026</div>
</div>
</div>
