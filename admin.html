<!DOCTYPE html>
<html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Admin</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:system-ui;padding:15px}
.login-box{max-width:360px;margin:50px auto;background:#18181f;border:1px solid #252530;padding:24px;border-radius:18px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}
.btn{background:#ff4d88;color:#fff;border:0;width:100%;padding:13px;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer}
.card{background:#18181f;border:1px solid #252530;border-radius:14px;padding:10px;margin:10px 0;display:flex;gap:12px;align-items:center}
.card img{width:75px;height:75px;object-fit:cover;border-radius:10px}
</style></head><body>
<div id="loginDiv" class="login-box">
<h2 style="color:#ff4d88">👑 VENUS ADMIN</h2>
<input id="u" placeholder="Username - admin">
<input id="p" type="password" placeholder="Password - venus123">
<button class="btn" onclick="login()">Login</button>
</div>
<div id="adminDiv" style="display:none;max-width:600px;margin:0 auto">
<h2 style="color:#ff4d88">📸 Upload - <span id="count">0</span></h2>
<div style="background:#18181f;border:1px dashed #ff4d8850;padding:15px;border-radius:14px;margin:12px 0">
<input type="file" id="fileInput" accept="image/*" multiple>
<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price - 499">
<button class="btn" onclick="uploadNow()">🚀 Gallery ত Upload</button>
</div>
<div id="list"></div>
<button class="btn" style="background:#222" onclick="window.open('gallery.html','_blank')">Gallery চাওক</button>
</div>
<script>
function login(){if(u.value==='admin'&&p.value==='venus123'){localStorage.setItem('venus_admin','1');loginDiv.style.display='none';adminDiv.style.display='block';loadList();}else alert('admin / venus123');}
if(localStorage.getItem('venus_admin')){loginDiv.style.display='none';adminDiv.style.display='block';loadList();}
function uploadNow(){let files=fileInput.files;if(!files.length)return alert('Photo Select কৰক');for(let f of files){let r=new FileReader();r.onload=e=>{let pr=JSON.parse(localStorage.getItem('venus_products')||'[]');pr.push({name:pname.value||'Venus Product',price:pprice.value||'499',photo:e.target.result});localStorage.setItem('venus_products',JSON.stringify(pr));loadList();};r.readAsDataURL(f);}alert('✅ Upload হৈ গল');}
function loadList(){let pr=JSON.parse(localStorage.getItem('venus_products')||'[]');count.innerText=pr.length+' Photos';let h='';[...pr].reverse().forEach((p,i)=>{let idx=pr.length-1-i;h+=`<div class="card"><img src="${p.photo}"><div style="flex:1"><b>${p.name}</b><br><span style="color:#ff4d88">₹${p.price}</span></div><button onclick="del(${idx})" style="background:#ff4d8820;color:#ff4d88;border:0;padding:8px 12px;border-radius:8px">X</button></div>`});list.innerHTML=h;}
function del(i){let pr=JSON.parse(localStorage.getItem('venus_products')||'[]');pr.splice(i,1);localStorage.setItem('venus_products',JSON.stringify(pr));loadList();}
</script></body></html>
