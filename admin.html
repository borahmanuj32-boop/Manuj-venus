<!DOCTYPE html>
<html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Admin</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:system-ui;padding:15px}
.box{max-width:380px;margin:40px auto;background:#18181f;border:1px solid #252530;padding:20px;border-radius:18px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}
.btn{background:#ff4d88;color:#fff;border:0;width:100%;padding:13px;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer}
.loader{display:none;text-align:center;padding:15px;background:#ff4d8815;border-radius:10px;margin:10px 0;border:1px solid #ff4d8830}
.spin{width:30px;height:30px;border:3px solid #333;border-top:3px solid #ff4d88;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:#18181f;border:1px solid #252530;border-radius:14px;padding:10px;margin:10px 0;display:flex;gap:12px;align-items:center}
.card img{width:70px;height:70px;object-fit:cover;border-radius:10px}
</style></head><body>
<div id="loginDiv" class="box">
<h2 style="color:#ff4d88">👑 VENUS ADMIN</h2>
<input id="u" placeholder="admin"><input id="p" type="password" placeholder="venus123">
<button class="btn" onclick="login()">Login</button>
</div>
<div id="adminDiv" style="display:none;max-width:600px;margin:0 auto">
<h2 style="color:#ff4d88">📸 Upload - <span id="count">0</span></h2>
<div style="background:#18181f;border:1px dashed #ff4d8850;padding:15px;border-radius:14px;margin:12px 0">
<input type="file" id="fileInput" accept="image/*">
<input id="pname" placeholder="Product Name" value="Art">
<input id="pprice" placeholder="Price">
<div class="loader" id="loader"><div class="spin"></div><b>Uploading... ⏳</b></div>
<p id="msg" style="display:none;color:#4ade80;text-align:center;margin-top:8px">✅ Success!</p>
<button class="btn" id="uploadBtn" onclick="uploadNow()">🚀 Gallery ত Upload</button>
</div>
<div id="list"></div>
<button class="btn" style="background:#222;margin-top:15px" onclick="location.href='gallery.html'">Gallery চাওক</button>
</div>
<script>
function login(){if(u.value==='admin'&&p.value==='venus123'){localStorage.setItem('venus_admin','1');loginDiv.style.display='none';adminDiv.style.display='block';loadList();}else alert('admin / venus123');}
if(localStorage.getItem('venus_admin')){loginDiv.style.display='none';adminDiv.style.display='block';loadList();}
function uploadNow(){
 let file=fileInput.files[0]; if(!file) return alert('Photo Select কৰক');
 let name=pname.value||'Product'; let price=pprice.value||'499';
 loader.style.display='block'; uploadBtn.disabled=true; uploadBtn.innerText='Uploading...';
 let r=new FileReader();
 r.onload=e=>{
   let pr=JSON.parse(localStorage.getItem('venus_products')||'[]');
   pr.push({name:name,price:price,photo:e.target.result});
   localStorage.setItem('venus_products',JSON.stringify(pr));
   loader.style.display='none'; msg.style.display='block'; uploadBtn.disabled=false; uploadBtn.innerText='🚀 Gallery ত Upload'; fileInput.value=''; loadList();
 };
 r.readAsDataURL(file);
}
function loadList(){let pr=JSON.parse(localStorage.getItem('venus_products')||'[]');count.innerText=pr.length+' Photos'; let h=''; [...pr].reverse().forEach((p,i)=>{let idx=pr.length-1-i; h+=`<div class="card"><img src="${p.photo}"><div style="flex:1"><b>${p.name}</b><br><span style="color:#ff4d88">₹${p.price}</span></div><button onclick="del(${idx})" style="background:#ff4d8820;color:#ff4d88;border:0;padding:8px 12px;border-radius:8px">X</button></div>`}); list.innerHTML=h;}
function del(i){let pr=JSON.parse(localStorage.getItem('venus_products')||'[]'); pr.splice(i,1); localStorage.setItem('venus_products',JSON.stringify(pr)); loadList();}
</script></body></html>
