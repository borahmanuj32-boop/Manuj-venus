<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Venus PRO MAX</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08080a;color:#fff;font-family:system-ui;padding:14px}
.box{max-width:400px;margin:30px auto;background:#18181f;border:1px solid #333;padding:20px;border-radius:20px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}
.btn{background:#ff4d88;color:#fff;border:0;width:100%;padding:13px;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.arch{width:100%;height:16px;background:#1a1a22;border-radius:20px;overflow:hidden;margin:10px 0;border:1px solid #2a2a35}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#ff4d88,#ff8fab,#ff4d88);transition:width 0.3s;box-shadow:0 0 10px #ff4d88}
.card{background:#18181f;border:1px solid #252530;border-radius:12px;padding:8px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}
</style></head><body>
<div id="loginDiv" class="box"><h2 style="color:#ff4d88">👑 VENUS PRO MAX</h2><p style="opacity:.5;font-size:11px">IndexedDB - Unlimited Storage</p><input id="u" placeholder="admin"><input id="p" type="password" placeholder="venus123"><button class="btn" onclick="login()">Login</button></div>
<div id="adminDiv" style="display:none;max-width:600px;margin:0 auto">
<h2 style="color:#ff4d88">VENUS - <span id="count">0</span></h2>
<div style="background:#18181f;border:1px dashed #ff4d8840;padding:14px;border-radius:14px;margin:10px 0">
<input type="file" id="fileInput" accept="image/*"><input id="pname" value="Art"><input id="pprice" value="00">
<div id="archWrap" style="display:none"><div id="archText" style="text-align:center;color:#ff4d88;font-weight:700">0%</div><div class="arch"><div class="fill" id="fill"></div></div></div>
<div id="msg" style="display:none;padding:10px;background:#10b98120;border:1px solid #10b98140;border-radius:8px;color:#10b981;text-align:center;margin:8px 0"></div>
<button class="btn" id="btn" onclick="uploadNow()">🚀 Upload কৰক</button>
<button class="btn" style="background:#222;margin-top:8px;font-size:12px" onclick="clearDB()">🗑️ Full Clear - Quota Fix</button>
</div><div id="list"></div><button class="btn" style="background:#222" onclick="location.href='gallery.html'">Gallery চাওক</button>
</div>
<script>
function login(){if(u.value==='admin'&&p.value==='venus123'){localStorage.setItem('venus_admin','1');loginDiv.style.display='none';adminDiv.style.display='block';loadList();}else alert('admin/venus123');}
if(localStorage.getItem('venus_admin')){loginDiv.style.display='none';adminDiv.style.display='block';loadList();}

let db; let req=indexedDB.open('VenusDB',1);
req.onupgradeneeded=e=>{e.target.result.createObjectStore('products',{keyPath:'id',autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result; loadList();};
req.onerror=()=>{alert('DB Error');};

function setP(p,t){fill.style.width=p+'%';archText.innerText=t+' '+p+'%';}
function clearDB(){if(!confirm('Full Clear?'))return; let tx=db.transaction('products','readwrite'); tx.objectStore('products').clear().onsuccess=()=>{localStorage.removeItem('venus_products');loadList();alert('✅ Clear হৈ গল! এতিয়া Upload কৰক');};}

function uploadNow(){
 let file=fileInput.files[0]; if(!file) return alert('Photo Select কৰক');
 let name=pname.value||'Art'; let price=pprice.value||'00';
 archWrap.style.display='block'; msg.style.display='none'; btn.disabled=true; setP(10,'Reading...');
 let reader=new FileReader();
 reader.onload=e=>{
  setP(40,'Compressing...'); let img=new Image();
  img.onload=()=>{
   let c=document.createElement('canvas'); let max=600; let w=img.width,h=img.height;
   if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}
   c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   setP(70,'Saving to Big Storage...');
   let comp=c.toDataURL('image/jpeg',0.5);
   setP(90,'Final...');
   let tx=db.transaction('products','readwrite');
   tx.objectStore('products').add({name:name,price:price,photo:comp,date:Date.now()});
   tx.oncomplete=()=>{setP(100,'Done 100% ✅'); setTimeout(()=>{archWrap.style.display='none';msg.style.display='block';msg.innerText='✅ Upload Success! Gallery ত চাওক!';btn.disabled=false;fileInput.value='';loadList();},500);};
   tx.onerror=()=>{alert('DB Error: '+tx.error);btn.disabled=false;};
  }; img.src=e.target.result;
 }; reader.readAsDataURL(file);
}
function loadList(){
 if(!db) return;
 let tx=db.transaction('products','readonly'); let store=tx.objectStore('products'); let all=store.getAll();
 all.onsuccess=()=>{
  let pr=all.result||[]; count.innerText=pr.length+' Photos';
  let h=''; [...pr].reverse().forEach(p=>{h+=`<div class="card"><img src="${p.photo}"><div style="flex:1"><b>${p.name}</b><br>₹${p.price}</div><button onclick="del(${p.id})" style="background:#ff4d8820;color:#ff4d88;border:0;padding:6px 10px;border-radius:6px">X</button></div>`;});
  list.innerHTML=h||'<p style="opacity:.4;text-align:center;padding:20px">নাই</p>';
  // also sync to localStorage for gallery compatibility
  try{localStorage.setItem('venus_products',JSON.stringify(pr.slice(-20)));}catch(e){}
 };
}
function del(id){let tx=db.transaction('products','readwrite'); tx.objectStore('products').delete(id).onsuccess=loadList;}
</script></body></html>
