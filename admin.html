<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Venus FINAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08080a;color:#fff;font-family:system-ui;padding:14px}
.box{max-width:400px;margin:20px auto;background:#18181f;border:1px solid #333;padding:20px;border-radius:20px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}
.btn{background:#ff4d88;color:#fff;border:0;width:100%;padding:13px;border-radius:12px;font-weight:800;margin-top:10px}
.arch{width:100%;height:14px;background:#1a1a22;border-radius:20px;overflow:hidden;margin:10px 0}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#ff4d88,#ff8fab);transition:width 0.2s}
.card{background:#18181f;border:1px solid #252530;border-radius:12px;padding:8px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}
</style></head><body>
<div id="loginDiv" class="box"><h2 style="color:#ff4d88">VENUS FINAL</h2><input id="u" placeholder="admin"><input id="p" type="password" placeholder="venus123"><button class="btn" onclick="login()">Login</button></div>
<div id="adminDiv" style="display:none;max-width:600px;margin:0 auto">
<h2 style="color:#ff4d88">VENUS - <span id="count">0</span></h2>
<div style="background:#18181f;border:1px dashed #ff4d8840;padding:14px;border-radius:14px;margin:10px 0">
<input type="file" id="fileInput" accept="image/*"><input id="pname" value="Art"><input id="pprice" value="00">
<div id="archWrap" style="display:none"><div id="archText" style="text-align:center;color:#ff4d88;font-weight:700">0%</div><div class="arch"><div class="fill" id="fill"></div></div><div id="err" style="color:#ff6b6b;font-size:11px;text-align:center"></div></div>
<button class="btn" id="btn" onclick="uploadNow()">🚀 Upload কৰক</button>
<button class="btn" style="background:#333;margin-top:8px;font-size:12px" onclick="clearAll()">🗑️ Storage Clear (70% Fix)</button>
</div><div id="list"></div><button class="btn" style="background:#222" onclick="location.href='gallery.html'">Gallery চাওক</button>
</div>
<script>
function login(){if(u.value==='admin'&&p.value==='venus123'){localStorage.setItem('venus_admin','1');loginDiv.style.display='none';adminDiv.style.display='block';loadList();}else alert('admin/venus123');}
if(localStorage.getItem('venus_admin')){loginDiv.style.display='none';adminDiv.style.display='block';loadList();}
function clearAll(){if(confirm('সকলো Delete কৰি Storage খালি কৰিব?')){localStorage.removeItem('venus_products');loadList();alert('Clear হৈ গল! এতিয়া Upload কৰক');}}
function setP(p,t){fill.style.width=p+'%';archText.innerText=t+' '+p+'%';}
function uploadNow(){
 let file=fileInput.files[0]; if(!file) return alert('Photo Select কৰক');
 archWrap.style.display='block'; btn.disabled=true; err.innerText=''; setP(20,'Reading...');
 let reader=new FileReader();
 reader.onload=e=>{
  setP(40,'Compressing...');
  let img=new Image();
  img.onload=()=>{
   try{
    let c=document.createElement('canvas');
    let max=500; // আৰু সৰু কৰিলোঁ
    let w=img.width,h=img.height;
    if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    setP(70,'Saving... 70%');
    let comp=c.toDataURL('image/jpeg',0.4); // Quality 0.4 = Super Small
    setP(85,'Final Save...');
    let pr=[]; try{pr=JSON.parse(localStorage.getItem('venus_products')||'[]');}catch(e){pr=[];}
    pr.push({name:pname.value||'Art',price:pprice.value||'00',photo:comp});
    localStorage.setItem('venus_products',JSON.stringify(pr));
    setP(100,'Done! 100% ✅');
    setTimeout(()=>{archWrap.style.display='none';btn.disabled=false;fileInput.value='';loadList();alert('✅ হৈ গল প্ৰভু! Gallery ত চাওক');},600);
   }catch(ex){
    err.innerText='Storage Full! Clear Button ত Click কৰক! Error: '+ex.message;
    setP(70,'FAILED - Clear কৰক'); btn.disabled=false;
   }
  };
  img.onerror=()=>{err.innerText='Image Error';btn.disabled=false;};
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}
function loadList(){let pr=[];try{pr=JSON.parse(localStorage.getItem('venus_products')||'[]');}catch(e){}count.innerText=pr.length;let h='';[...pr].reverse().forEach((p,i)=>{let idx=pr.length-1-i;h+=`<div class="card"><img src="${p.photo}"><div style="flex:1"><b>${p.name}</b><br>₹${p.price}</div><button onclick="del(${idx})" style="background:#ff4d8820;color:#ff4d88;border:0;padding:6px 10px;border-radius:6px">X</button></div>`});list.innerHTML=h||'<p style="opacity:.4;text-align:center;padding:20px">নাই</p>';}
function del(i){let pr=JSON.parse(localStorage.getItem('venus_products')||'[]');pr.splice(i,1);localStorage.setItem('venus_products',JSON.stringify(pr));loadList();}
</script></body></html>
