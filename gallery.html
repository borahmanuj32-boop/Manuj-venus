<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuj & Venus - Secure Final</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:'Poppins',sans-serif}
:root{--pink:#ff4d88}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{font-family:'Great Vibes',cursive;font-size:2.2rem;color:var(--pink)}
.btn{padding:9px 18px;border-radius:22px;border:1px solid var(--pink);background:transparent;color:var(--pink);cursor:pointer;font-weight:600}
.btn-fill{background:var(--pink);color:#fff}
.hero{height:42vh;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.folder{background:#1a1a1e;border:1px solid #222;border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.folder.active{border-color:var(--pink);background:#21151a}
.card{position:relative;border-radius:14px;overflow:hidden;background:#1a1a1e;aspect-ratio:1;border:1px solid #222}
.card img{width:100%;height:100%;object-fit:cover}
.card .ov{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:8px;display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:500;padding:18px}
.modal.active{display:flex}
.box{background:#1e1e22;padding:22px;border-radius:20px;width:100%;max-width:400px;border:1px solid #333;max-height:92vh;overflow:auto}
.input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #333;background:#0f0f10;color:#fff;margin:7px 0;outline:none}
.hide{display:none!important}
.upload-area{border:2px dashed #444;border-radius:12px;padding:18px;text-align:center;margin:10px 0;background:#0f0f10}
.icon-btn{background:rgba(0,0,0,.85);border:1px solid #333;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#preview{width:100%;margin-top:12px;border-radius:12px;max-height:240px;object-fit:cover;border:1px solid #333}
.loader{border:3px solid #222;border-top:3px solid var(--pink);border-radius:50%;width:28px;height:28px;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{width:100%;height:6px;background:#222;border-radius:10px;overflow:hidden;margin:10px 0}
.progress-bar{height:100%;background:var(--pink);width:0%;transition:.3s}
</style>
</head>
<body>
<div class="header"><div class="logo">Manuj & Venus</div><div style="display:flex;gap:8px;align-items:center"><span id="userEmail" style="opacity:.7;font-size:.75rem;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button id="loginBtn" class="btn">Login</button><button id="logoutBtn" class="btn hide">SignOut</button></div></div>
<div class="hero" id="hero"><p style="opacity:.5">No Photos</p></div>
<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>📁 Folders</h3><button id="newFolderBtn" class="btn btn-fill hide">+ Folder</button></div>
<div class="grid" id="folderGrid"></div>
<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>🖼️ Photos</h3><button id="uploadBtn" class="btn btn-fill hide">+ Upload</button></div>
<div class="grid" id="photoGrid"></div>
<div class="modal" id="authModal"><div class="box"><h2 style="font-family:'Great Vibes',cursive;color:var(--pink);font-size:2.6rem;text-align:center">স্বাগতম</h2><input id="emailInput" class="input" type="email" value="borahmanuj32@gmail.com"><input id="passInput" class="input" type="password" value="venus123"><button id="signupEmailBtn" class="btn btn-fill" style="width:100%;padding:13px;margin-top:8px">চাইনআপ কৰক</button><button id="loginEmailBtn" class="btn" style="width:100%;padding:13px;margin-top:8px">লগইন কৰক</button><button id="googleBtn" class="btn" style="width:100%;background:#fff;color:#000;padding:13px;margin-top:8px">গুগলৰ সৈতে</button><p style="text-align:center;margin-top:12px;opacity:.6;cursor:pointer" id="closeAuth">বন্ধ</p><hr style="margin:16px 0"><input id="adminEmail" class="input" value="borahmanuj32@gmail.com"><input id="adminPass" class="input" type="password" value="venus123"><button id="adminLoginBtn" class="btn" style="width:100%;border-color:gold;color:gold;padding:13px;margin-top:6px">👑 প্ৰশাসক লগইন</button></div></div>
<div class="modal" id="upModal"><div class="box"><h3>📤 Upload</h3><select id="folderSelect" class="input"></select><div class="upload-area"><input type="file" id="fileInput" accept="image/*" style="width:100%"><p id="fileInfo" style="opacity:.6;font-size:.85rem;margin-top:8px">Auto Compress - যি কোনো Size</p><img id="preview" class="hide"><div id="loaderBox" class="hide"><div class="loader"></div><p style="text-align:center;opacity:.7">Upload হৈ আছে...</p><div class="progress"><div class="progress-bar" id="pBar"></div></div></div></div><input id="captionInput" class="input" placeholder="Caption"><button id="savePhotoBtn" class="btn btn-fill" style="width:100%;padding:13px">💾 Save</button><p id="status" style="text-align:center;margin-top:10px;color:var(--pink)"></p><p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" id="closeUp">Cancel</p></div></div>
<div class="modal" id="editModal"><div class="box"><h3>✏️ Edit Photo - Admin Only</h3><img id="editPreview" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover;margin:10px 0"><select id="editFolder" class="input"></select><input id="editCaption" class="input" placeholder="New Caption"><button id="saveEditBtn" class="btn btn-fill" style="width:100%;padding:13px">💾 Update Save</button><p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" id="closeEdit">Cancel</p></div></div>
<script>
let currentFolder='All',selectedFile=null,selectedBase64=null,slideIndex=0,slideTimer=null,editingId=null;const $=id=>document.getElementById(id);
const getUsers=()=>JSON.parse(localStorage.getItem('mv_users')||'[]');const saveUsers=u=>localStorage.setItem('mv_users',JSON.stringify(u));
const getPhotos=()=>JSON.parse(localStorage.getItem('mv_photos')||'[]');const savePhotos=p=>localStorage.setItem('mv_photos',JSON.stringify(p));
const getFolders=()=>JSON.parse(localStorage.getItem('mv_folders')||'["All","Girls","art","A"]');const saveFolders=f=>localStorage.setItem('mv_folders',JSON.stringify(f));
const isLogged=()=>!!localStorage.getItem('mv_current');const isAdmin=()=>localStorage.getItem('mv_admin')==='1';
$('closeAuth').onclick=()=>$('authModal').classList.remove('active');$('closeUp').onclick=()=>{$('upModal').classList.remove('active');resetUpload();};$('closeEdit').onclick=()=>$('editModal').classList.remove('active');
$('loginBtn').onclick=()=>$('authModal').classList.add('active');$('uploadBtn').onclick=()=>{if(!isLogged()&&!isAdmin()){alert('Login কৰক প্ৰভু');return;}refreshFolderSelect();$('upModal').classList.add('active');};
$('newFolderBtn').onclick=()=>{if(!isLogged()&&!isAdmin()){alert('Login কৰক');return;}let n=prompt('Folder Name:');if(n){n=n.trim();let f=getFolders();if(n&&!f.includes(n)){f.push(n);saveFolders(f);loadFolders();}}};
function resetUpload(){selectedFile=null;selectedBase64=null;$('fileInput').value='';$('preview').classList.add('hide');$('loaderBox').classList.add('hide');$('fileInfo').textContent='Auto Compress';$('status').textContent='';$('pBar').style.width='0%';$('savePhotoBtn').disabled=false;$('savePhotoBtn').textContent='💾 Save';}
$('fileInput').onchange=e=>{let file=e.target.files[0];if(!file)return;selectedFile=file;$('fileInfo').textContent=`📁 ${file.name} - ${(file.size/1024).toFixed(0)}KB`;let r=new FileReader();r.onload=()=>{selectedBase64=r.result;$('preview').src=selectedBase64;$('preview').classList.remove('hide');$('status').textContent='✅ Ready';};r.readAsDataURL(file);};
function compressImage(b64,cb){$('loaderBox').classList.remove('hide');$('pBar').style.width='30%';let img=new Image();img.onload=()=>{$('pBar').style.width='60%';let c=document.createElement('canvas');let max=1000;let s=Math.min(1,max/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);$('pBar').style.width='85%';setTimeout(()=>{cb(c.toDataURL('image/jpeg',0.65));$('pBar').style.width='100%';},200);};img.src=b64;}
$('signupEmailBtn').onclick=()=>{let e=$('emailInput').value.trim(),p=$('passInput').value.trim();if(!e||!p)return alert('Mail Pass দিয়ক');let u=getUsers();if(u.find(x=>x.email===e))return alert('SignUp হৈছে');u.push({email:e,pass:p});saveUsers(u);localStorage.setItem('mv_current',JSON.stringify({email:e}));alert('✅ SignUp Success');$('authModal').classList.remove('active');checkAuth();};
$('loginEmailBtn').onclick=()=>{let e=$('emailInput').value.trim(),p=$('passInput').value.trim();if(!getUsers().find(x=>x.email===e&&x.pass===p))return alert('ভুল');localStorage.setItem('mv_current',JSON.stringify({email:e}));alert('✅ Login');$('authModal').classList.remove('active');checkAuth();};
$('googleBtn').onclick=()=>{let e=$('emailInput').value.trim()||'borahmanuj32@gmail.com';localStorage.setItem('mv_current',JSON.stringify({email:e}));alert('✅ Google Login');$('authModal').classList.remove('active');checkAuth();};
$('adminLoginBtn').onclick=()=>{let e=$('adminEmail').value.trim(),p=$('adminPass').value.trim();if(!e||!p)return alert('Admin দিয়ক');localStorage.setItem('mv_current',JSON.stringify({email:e}));localStorage.setItem('mv_admin','1');alert('👑 Admin Success');$('authModal').classList.remove('active');checkAuth();};
$('savePhotoBtn').onclick=()=>{if(!selectedBase64)return alert('Photo Select কৰক');if(!isLogged()&&!isAdmin())return alert('Login কৰক');$('savePhotoBtn').disabled=true;$('savePhotoBtn').textContent='⏳ Loading...';$('status').textContent='Saving...';compressImage(selectedBase64,c=>{let f=$('folderSelect').value||'All',cap=$('captionInput').value.trim()||'A';let ph=getPhotos();try{ph.push({id:Date.now(),folder:f,caption:cap,src:c,time:Date.now()});savePhotos(ph);$('status').textContent='✅ Saved '+(c.length/1024).toFixed(0)+'KB';setTimeout(()=>{$('upModal').classList.remove('active');resetUpload();$('captionInput').value='';loadPhotos();loadHero();},700);}catch(e){alert('Storage Full');$('savePhotoBtn').disabled=false;$('savePhotoBtn').textContent='💾 Save';}});};
function checkAuth(){let cur=JSON.parse(localStorage.getItem('mv_current')||'null');let admin=isAdmin(),logged=isLogged();if(logged||admin){$('userEmail').textContent=cur?cur.email:'Admin';$('loginBtn').classList.add('hide');$('logoutBtn').classList.remove('hide');$('newFolderBtn').classList.remove('hide');$('uploadBtn').classList.remove('hide');}else{$('loginBtn').classList.remove('hide');$('logoutBtn').classList.add('hide');$('newFolderBtn').classList.add('hide');$('uploadBtn').classList.add('hide');$('userEmail').textContent='';}loadFolders();loadPhotos();loadHero();}
$('logoutBtn').onclick=()=>{localStorage.removeItem('mv_current');localStorage.removeItem('mv_admin');alert('✅ SignOut হল - Edit/Delete Hide হল');checkAuth();};
function refreshFolderSelect(){let f=getFolders();$('folderSelect').innerHTML=f.map(n=>`<option value="${n}">${n}</option>`).join('');$('editFolder').innerHTML=f.map(n=>`<option value="${n}">${n}</option>`).join('');}
function loadFolders(){let f=getFolders();refreshFolderSelect();$('folderGrid').innerHTML=f.map(n=>`<div class="folder ${currentFolder===n?'active':''}" onclick="filterFolder('${n}')"><div style="font-size:2rem">📁</div><p>${n}</p></div>`).join('');}
window.filterFolder=n=>{currentFolder=n;loadFolders();loadPhotos();};
function loadPhotos(){let ph=getPhotos(),fil=currentFolder==='All'?ph:ph.filter(p=>p.folder===currentFolder);let logged=isLogged()||isAdmin();if(fil.length===0){$('photoGrid').innerHTML=`<p style="opacity:.4;padding:20px;grid-column:1/-1">No Photos in ${currentFolder}</p>`;return;}$('photoGrid').innerHTML=fil.map(p=>{let editDeleteBtns=logged?`<button class="icon-btn" onclick="editPhoto(${p.id})">✏️</button><button class="icon-btn" onclick="deletePhoto(${p.id})" style="color:#ff5a5a">🗑️</button>`:'';let shareDownload=`<button class="icon-btn" onclick="sharePhoto(${p.id})">↗️</button><button class="icon-btn" onclick="downloadPhoto(${p.id})">⬇️</button>`;return `<div class="card"><img src="${p.src}" onclick="openFull(${p.id})"><div class="ov"><small style="max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.caption}</small><div style="display:flex;gap:4px">${shareDownload}${editDeleteBtns}</div></div></div>`;}).join('');}
window.openFull=id=>{let p=getPhotos().find(x=>x.id==id);let w=window.open();w.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh"><img src="${p.src}" style="max-width:100%;max-height:100%"></body>`);};
window.sharePhoto=async id=>{if(navigator.share){try{await navigator.share({title:getPhotos().find(x=>x.id==id).caption,url:location.href})}catch(e){}}else prompt('Link:',location.href);};
window.downloadPhoto=id=>{let p=getPhotos().find(x=>x.id==id);let a=document.createElement('a');a.href=p.src;a.download=(p.caption||'photo')+'.jpg';a.click();};
window.deletePhoto=id=>{if(!isLogged()&&!isAdmin()){alert('⛔ SignOut হৈ আছে - Delete নোৱাৰে! Login কৰক');return;}if(confirm('Delete কৰিব নে?')){savePhotos(getPhotos().filter(p=>p.id!=id));loadPhotos();loadHero();}};
window.editPhoto=id=>{if(!isLogged()&&!isAdmin()){alert('⛔ SignOut - Edit নোৱাৰে! Login কৰক');return;}let p=getPhotos().find(x=>x.id==id);if(!p)return;editingId=id;$('editPreview').src=p.src;$('editCaption').value=p.caption;$('editFolder').value=p.folder;$('editModal').classList.add('active');};
$('saveEditBtn').onclick=()=>{if(!isLogged()&&!isAdmin()){alert('Login কৰক');return;}let ph=getPhotos(),p=ph.find(x=>x.id==editingId);if(p){p.caption=$('editCaption').value.trim()||p.caption;p.folder=$('editFolder').value;savePhotos(ph);$('editModal').classList.remove('active');loadPhotos();loadHero();alert('✅ Edited & Saved!');}};
function loadHero(){let ph=getPhotos();if(ph.length===0){$('hero').innerHTML='<p style="opacity:.4">No Photos</p>';return;}if(slideTimer)clearInterval(slideTimer);function show(i){let p=ph[i%ph.length];$('hero').innerHTML=`<img src="${p.src}"><div style="position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:.85rem">${p.caption} - ${p.folder}</div>`;}show(slideIndex);slideTimer=setInterval(()=>{slideIndex++;show(slideIndex);},3500);$('hero').onclick=()=>{slideIndex++;show(slideIndex);};}checkAuth();
</script>
</body>
</html>
