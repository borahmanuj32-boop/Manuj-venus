<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuj & Venus - UNLIMITED OFFLINE ♾️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTWFudWogJiBWZW51cyAtIFVubGltaXRlZCIsInNob3J0X25hbWUiOiJNJlYiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBhMGEwYyIsInRoZW1lX2NvbG9yIjoiI2ZmNGQ4OCJ9">
<meta name="theme-color" content="#ff4d88">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:'Poppins',sans-serif}
:root{--pink:#ff4d88}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{font-family:'Great Vibes',cursive;font-size:2.2rem;color:var(--pink)}
.btn{padding:9px 18px;border-radius:22px;border:1px solid var(--pink);background:transparent;color:var(--pink);cursor:pointer;font-weight:600}
.btn-fill{background:var(--pink);color:#fff}
.hero{height:42vh;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.folder{background:#1a1a1e;border:1px solid #222;border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.folder.active{border-color:var(--pink);background:#21151a}
.card{position:relative;border-radius:14px;overflow:hidden;background:#1a1a1e;aspect-ratio:1;border:1px solid #222}
.card img{width:100%;height:100%;object-fit:cover}
.card.ov{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:8px;display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:500;padding:18px}
.modal.active{display:flex}
.box{background:#1e1e22;padding:22px;border-radius:20px;width:100%;max-width:420px;border:1px solid #333;max-height:92vh;overflow:auto}
.input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #333;background:#0f0f10;color:#fff;margin:7px 0;outline:none}
.hide{display:none!important}
.upload-area{border:2px dashed #444;border-radius:12px;padding:18px;text-align:center;margin:10px 0;background:#0f0f10}
.icon-btn{background:rgba(0,0,0,.85);border:1px solid #333;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#preview{width:100%;margin-top:12px;border-radius:12px;max-height:240px;object-fit:cover;border:1px solid #333}
.loader{border:3px solid #222;border-top:3px solid var(--pink);border-radius:50%;width:28px;height:28px;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{width:100%;height:6px;background:#222;border-radius:10px;overflow:hidden;margin:10px 0}
.progress-bar{height:100%;background:var(--pink);width:0%;transition:.3s}
.pass-wrap{position:relative}.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer}
.badge{background:var(--pink);padding:2px 8px;border-radius:12px;font-size:.7rem;margin-left:6px}
.off-badge{background:#00d68f;padding:3px 8px;border-radius:12px;font-size:.65rem;margin-left:6px;color:#000;font-weight:700}
</style>
</head>
<body>
<div class="header"><div class="logo">Manuj & Venus <span class="badge">♾️</span><span class="off-badge" id="netStatus">● Online</span></div><div style="display:flex;gap:8px;align-items:center"><span id="userEmail" style="opacity:.7;font-size:.7rem"></span><button id="loginBtn" class="btn">Login</button><button id="logoutBtn" class="btn hide">SignOut</button></div></div>
<div class="hero" id="hero"><p style="opacity:.5">♾️ Unlimited + Offline</p></div>
<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>📁 Folders <small id="countInfo" style="opacity:.6"></small></h3><button id="newFolderBtn" class="btn btn-fill hide">+ Folder</button></div>
<div class="grid" id="folderGrid"></div>
<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>🖼️ Photos</h3><div style="display:flex;gap:8px"><button id="clearAllBtn" class="btn hide" style="border-color:#ff4444;color:#ff4444">🗑️ Clear</button><button id="uploadBtn" class="btn btn-fill hide">+ Upload ♾️</button></div></div>
<div class="grid" id="photoGrid"></div>
<div class="modal" id="authModal"><div class="box"><h2 style="font-family:'Great Vibes',cursive;color:var(--pink);font-size:2.6rem;text-align:center">স্বাগতম</h2><p style="text-align:center;opacity:.6;font-size:.85rem">♾️ Unlimited Offline - Login</p><input id="emailInput" class="input" type="email" placeholder="আপোনাৰ Email লিখক" autocomplete="off"><div class="pass-wrap"><input id="passInput" class="input" type="password" placeholder="Password লিখক" autocomplete="new-password"><span class="eye" id="eye1">👁️</span></div><button id="signupEmailBtn" class="btn btn-fill" style="width:100%;padding:13px;margin-top:8px">চাইনআপ কৰক</button><button id="loginEmailBtn" class="btn" style="width:100%;padding:13px;margin-top:8px">লগইন কৰক</button><button id="googleBtn" class="btn" style="width:100%;background:#fff;color:#000;padding:13px;margin-top:8px">গুগলৰ সৈতে</button><p style="text-align:center;margin-top:12px;opacity:.6;cursor:pointer" id="closeAuth">বন্ধ</p><hr style="margin:16px 0"><input id="adminEmail" class="input" type="email" placeholder="Admin Email" autocomplete="off"><div class="pass-wrap"><input id="adminPass" class="input" type="password" placeholder="Admin Password" autocomplete="new-password"><span class="eye" id="eye2">👁️</span></div><button id="adminLoginBtn" class="btn" style="width:100%;border-color:gold;color:gold;padding:13px;margin-top:6px">👑 প্ৰশাসক লগইন</button></div></div>
<div class="modal" id="upModal"><div class="box"><h3>📤 Offline Unlimited ♾️</h3><p style="opacity:.6;font-size:.8rem">Offline Save - Net নাথাকিলেও থাকিব</p><select id="folderSelect" class="input"></select><div class="upload-area"><input type="file" id="fileInput" accept="image/*" multiple style="width:100%"><p style="opacity:.7;font-size:.8rem;margin-top:6px">একেলগে 10 টা Select</p><p id="fileInfo" style="opacity:.6;font-size:.85rem;margin-top:8px">♾️ Offline Unlimited</p><img id="preview" class="hide"><div id="loaderBox" class="hide"><div class="loader"></div><div class="progress"><div class="progress-bar" id="pBar"></div></div><p id="loaderText" style="text-align:center;opacity:.7">Saving Offline...</p></div></div><input id="captionInput" class="input" placeholder="Caption"><button id="savePhotoBtn" class="btn btn-fill" style="width:100%;padding:13px">💾 Offline Save ♾️</button><p id="status" style="text-align:center;margin-top:10px;color:var(--pink)"></p><p id="storageInfo" style="text-align:center;margin-top:6px;opacity:.5;font-size:.75rem"></p><p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" id="closeUp">Cancel</p></div></div>
<div class="modal" id="editModal"><div class="box"><h3>✏️ Edit - Admin Only</h3><img id="editPreview" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover;margin:10px 0"><select id="editFolder" class="input"></select><input id="editCaption" class="input" placeholder="New Caption"><button id="saveEditBtn" class="btn btn-fill" style="width:100%;padding:13px">💾 Update Save</button><p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" id="closeEdit">Cancel</p></div></div>
<script>
function updateNet(){let el=document.getElementById('netStatus');if(navigator.onLine){el.textContent='● Online';el.style.background='#00d68f';}else{el.textContent='● Offline 📴';el.style.background='#ffaa00';}};window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);
if('serviceWorker' in navigator){let swCode=`self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open('mv-offline-v2').then(c=>c.addAll(['./'])))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./'))))});`;let blob=new Blob([swCode],{type:'text/javascript'});let swUrl=URL.createObjectURL(blob);navigator.serviceWorker.register(swUrl).then(()=>console.log('Offline Ready'));}

let db;function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('ManujVenusUnlimited',1);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej;});}
function dbAddPhoto(p){return new Promise((res,rej)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(p);tx.oncomplete=res;tx.onerror=rej;});}
function dbGetAll(){return new Promise((res,rej)=>{let tx=db.transaction('photos','readonly');let req=tx.objectStore('photos').getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=rej;});}
function dbDelete(id){return new Promise((res,rej)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=rej;});}
function dbClear(){return new Promise((res,rej)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=res;tx.onerror=rej;});}
let currentFolder='All',selectedFiles=[],slideIndex=0,slideTimer=null,editingId=null;const $=id=>document.getElementById(id);
const getUsers=()=>JSON.parse(localStorage.getItem('mv_users')||'[]');const saveUsers=u=>localStorage.setItem('mv_users',JSON.stringify(u));
const getFolders=()=>JSON.parse(localStorage.getItem('mv_folders')||'["All","Girls","art","A"]');const saveFolders=f=>localStorage.setItem('mv_folders',JSON.stringify(f));
const isLogged=()=>!!localStorage.getItem('mv_current');const isAdmin=()=>localStorage.getItem('mv_admin')==='1';
$('eye1').onclick=()=>{$('passInput').type=$('passInput').type==='password'?'text':'password';};$('eye2').onclick=()=>{$('adminPass').type=$('adminPass').type==='password'?'text':'password';};
$('closeAuth').onclick=()=>{$('authModal').classList.remove('active');clearAuth();};$('closeUp').onclick=()=>{$('upModal').classList.remove('active');resetUp();};$('closeEdit').onclick=()=>$('editModal').classList.remove('active');
$('loginBtn').onclick=()=>{clearAuth();$('authModal').classList.add('active');};$('uploadBtn').onclick=()=>{if(!isLogged()&&!isAdmin()){alert('Login কৰক');return;}refreshFolderSelect();$('upModal').classList.add('active');};
$('newFolderBtn').onclick=()=>{if(!isLogged()&&!isAdmin())return alert('Login');let n=prompt('Folder Name:');if(n){n=n.trim();let f=getFolders();if(n&&!f.includes(n)){f.push(n);saveFolders(f);loadFolders();}}};
$('clearAllBtn').onclick=async()=>{if(!isLogged()&&!isAdmin())return alert('Login');if(confirm('সকলো Delete?')){await dbClear();loadPhotos();loadHero();}};
function clearAuth(){$('emailInput').value='';$('passInput').value='';$('adminEmail').value='';$('adminPass').value='';}
function resetUp(){selectedFiles=[];$('fileInput').value='';$('preview').classList.add('hide');$('loaderBox').classList.add('hide');$('fileInfo').textContent='♾️ Offline Unlimited';$('status').textContent='';$('pBar').style.width='0%';$('savePhotoBtn').disabled=false;$('savePhotoBtn').textContent='💾 Offline Save ♾️';}
$('fileInput').onchange=e=>{selectedFiles=[...e.target.files];if(!selectedFiles.length)return;$('fileInfo').textContent=`📁 ${selectedFiles.length} টা - ${(selectedFiles.reduce((a,f)=>a+f.size,0)/1024/1024).toFixed(2)} MB`;let r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').classList.remove('hide');$('status').textContent=`✅ ${selectedFiles.length} Ready`;};r.readAsDataURL(selectedFiles[0]);};
function compressImage(file){return new Promise(res=>{let reader=new FileReader();reader.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=1100;let s=Math.min(1,max/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6));};img.src=e.target.result;};reader.readAsDataURL(file);});}
$('signupEmailBtn').onclick=()=>{let e=$('emailInput').value.trim(),p=$('passInput').value.trim();if(!e||!p)return alert('দিয়ক');let u=getUsers();if(u.find(x=>x.email===e))return alert('আগতে আছে');u.push({email:e,pass:p});saveUsers(u);localStorage.setItem('mv_current',JSON.stringify({email:e}));$('authModal').classList.remove('active');clearAuth();checkAuth();};
$('loginEmailBtn').onclick=()=>{let e=$('emailInput').value.trim(),p=$('passInput').value.trim();if(!getUsers().find(x=>x.email===e&&x.pass===p))return alert('ভুল');localStorage.setItem('mv_current',JSON.stringify({email:e}));$('authModal').classList.remove('active');clearAuth();checkAuth();};
$('googleBtn').onclick=()=>{let e=$('emailInput').value.trim();if(!e){e=prompt('Email:')||'';if(!e)return;}localStorage.setItem('mv_current',JSON.stringify({email:e}));$('authModal').classList.remove('active');clearAuth();checkAuth();};
$('adminLoginBtn').onclick=()=>{let e=$('adminEmail').value.trim(),p=$('adminPass').value.trim();if(!e||!p)return alert('Admin দিয়ক');localStorage.setItem('mv_current',JSON.stringify({email:e}));localStorage.setItem('mv_admin','1');$('authModal').classList.remove('active');clearAuth();checkAuth();};
$('savePhotoBtn').onclick=async()=>{if(!selectedFiles.length)return alert('Photo Select');if(!isLogged()&&!isAdmin())return alert('Login');$('savePhotoBtn').disabled=true;$('loaderBox').classList.remove('hide');let folder=$('folderSelect').value||'All',cap=$('captionInput').value.trim()||'A';for(let i=0;i<selectedFiles.length;i++){$('pBar').style.width=Math.round((i/selectedFiles.length)*100)+'%';$('loaderText').textContent=`${i+1}/${selectedFiles.length} Offline...`;let comp=await compressImage(selectedFiles[i]);await dbAddPhoto({id:Date.now()+i+Math.random(),folder,caption:cap,src:comp,time:Date.now()});}$('pBar').style.width='100%';$('status').textContent=`✅ ${selectedFiles.length} Offline Saved`;setTimeout(async()=>{$('upModal').classList.remove('active');resetUp();$('captionInput').value='';await loadPhotos();loadHero();},800);};
async function checkAuth(){await openDB();updateNet();let cur=JSON.parse(localStorage.getItem('mv_current')||'null');if(isLogged()||isAdmin()){$('userEmail').textContent=cur?cur.email:'Admin';$('loginBtn').classList.add('hide');$('logoutBtn').classList.remove('hide');$('newFolderBtn').classList.remove('hide');$('uploadBtn').classList.remove('hide');$('clearAllBtn').classList.remove('hide');}else{$('loginBtn').classList.remove('hide');$('logoutBtn').classList.add('hide');$('newFolderBtn').classList.add('hide');$('uploadBtn').classList.add('hide');$('clearAllBtn').classList.add('hide');$('userEmail').textContent='';}loadFolders();await loadPhotos();loadHero();}
$('logoutBtn').onclick=()=>{localStorage.removeItem('mv_current');localStorage.removeItem('mv_admin');alert('SignOut');checkAuth();};
function refreshFolderSelect(){let f=getFolders();$('folderSelect').innerHTML=f.map(n=>`<option value="${n}">${n}</option>`).join('');$('editFolder').innerHTML=f.map(n=>`<option value="${n}">${n}</option>`).join('');}
function loadFolders(){let f=getFolders();refreshFolderSelect();$('folderGrid').innerHTML=f.map(n=>`<div class="folder ${currentFolder===n?'active':''}" onclick="filterFolder('${n}')"><div style="font-size:2rem">📁</div><p>${n}</p></div>`).join('');}
window.filterFolder=n=>{currentFolder=n;loadFolders();loadPhotos();};
async function loadPhotos(){let all=await dbGetAll();$('countInfo').textContent=`(${all.length} ♾️📴)`;$('storageInfo').textContent=`♾️ ${(JSON.stringify(all).length/1024/1024).toFixed(2)} MB Offline`;let fil=currentFolder==='All'?all:all.filter(p=>p.folder===currentFolder);let logged=isLogged()||isAdmin();if(!fil.length){$('photoGrid').innerHTML=`<p style="opacity:.4;padding:20px;grid-column:1/-1">No Photos - Offline Upload ♾️📴</p>`;return;}$('photoGrid').innerHTML=fil.map(p=>{let ed=logged?`<button class="icon-btn" onclick="editPhoto('${p.id}')">✏️</button><button class="icon-btn" onclick="deletePhoto('${p.id}')" style="color:#ff5a5a">🗑️</button>`:'';return `<div class="card"><img src="${p.src}" loading="lazy" onclick="openFull('${p.id}')"><div class="ov"><small>${p.caption}</small><div style="display:flex;gap:4px"><button class="icon-btn" onclick="sharePhoto('${p.id}')">↗️</button><button class="icon-btn" onclick="downloadPhoto('${p.id}')">⬇️</button>${ed}</div></div></div>`;}).join('');}
window.openFull=async id=>{let all=await dbGetAll();let p=all.find(x=>String(x.id)===String(id));let w=window.open();w.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh"><img src="${p.src}" style="max-width:100%;max-height:100%"></body>`);};
window.sharePhoto=async id=>{if(navigator.share){try{let all=await dbGetAll();await navigator.share({title:all.find(x=>String(x.id)===String(id)).caption,url:location.href})}catch(e){}}else prompt('Link:',location.href);};
window.downloadPhoto=async id=>{let all=await dbGetAll();let p=all.find(x=>String(x.id)===String(id));let a=document.createElement('a');a.href=p.src;a.download=(p.caption||'photo')+'.jpg';a.click();};
window.deletePhoto=async id=>{if(!isLogged()&&!isAdmin()){alert('Login');return;}if(confirm('Delete?')){let all=await dbGetAll();let t=all.find(x=>String(x.id)===String(id));if(t)await dbDelete(t.id);await loadPhotos();loadHero();}};
window.editPhoto=async id=>{if(!isLogged()&&!isAdmin()){alert('Login');return;}let all=await dbGetAll();let p=all.find(x=>String(x.id)===String(id));if(!p)return;editingId=p.id;$('editPreview').src=p.src;$('editCaption').value=p.caption;$('editFolder').value=p.folder;$('editModal').classList.add('active');};
$('saveEditBtn').onclick=async()=>{if(!isLogged()&&!isAdmin())return alert('Login');let all=await dbGetAll();let p=all.find(x=>x.id===editingId);if(p){p.caption=$('editCaption').value.trim()||p.caption;p.folder=$('editFolder').value;await dbAddPhoto(p);$('editModal').classList.remove('active');await loadPhotos();loadHero();}};
async function loadHero(){let all=await dbGetAll();if(!all.length){$('hero').innerHTML='<p style="opacity:.5">♾️ Offline Ready - Net নাথাকিলেও চলিব 📴</p>';return;}if(slideTimer)clearInterval(slideTimer);function show(i){let p=all[i%all.length];$('hero').innerHTML=`<img src="${p.src}"><div style="position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:.8rem">${p.caption} | ${all.length} Offline ♾️</div>`;}show(slideIndex);slideTimer=setInterval(()=>{slideIndex++;show(slideIndex);},3000);$('hero').onclick=()=>{slideIndex++;show(slideIndex);};}openDB().then(()=>checkAuth());
</script>
</body>
</html>
