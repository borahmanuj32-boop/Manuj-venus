<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Venus Gallery</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:system-ui}.header{position:sticky;top:0;background:#0a0a0cE6;backdrop-filter:blur(10px);border-bottom:1px solid #1e1e28;padding:12px 15px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#18181f;border:1px solid #252530;border-radius:16px;overflow:hidden}.card img{width:100%;height:210px;object-fit:cover}.info{padding:8px 10px}.price{font-weight:800}.buy{background:#ff4d88;color:#fff;border:0;width:100%;padding:8px;border-radius:8px;font-weight:700;margin-top:4px}</style></head><body>
<div class="header"><b>VENUS GALLERY</b><span id="pcount" style="color:#ff4d88;font-weight:800"></span></div>
<div class="grid" id="grid"></div>
<script>
let products=JSON.parse(localStorage.getItem('venus_products')||'[]');
document.getElementById('pcount').innerText=products.length+' PHOTOS';
let h='';if(!products.length){h='<div style="grid-column:1/3;text-align:center;opacity:.4;padding:60px">📸 Photo নাই<br><a href="admin.html" style="color:#ff4d88">Admin ত Upload কৰক</a></div>'}
products.forEach(p=>{let msg=encodeURIComponent(`Hi Venus! I want ${p.name} - ₹${p.price}`);h+=`<div class="card"><img src="${p.photo}"><div class="info"><div style="font-size:12px">${p.name}</div><div class="price">₹${p.price}</div><button class="buy" onclick="window.open('https://wa.me/919999999999?text=${msg}','_blank')">Buy Now</button></div></div>`});
document.getElementById('grid').innerHTML=h;
</script></body></html>
