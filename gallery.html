<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuj & Venus - Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#08080a;color:#fff;font-family:'Poppins',sans-serif}
:root{--pink:#ff4d88}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{font-family:'Great Vibes',cursive;font-size:2.2rem;color:var(--pink)}
.btn{padding:8px 18px;border-radius:20px;border:1px solid var(--pink);background:transparent;color:var(--pink);cursor:pointer}
.btn-fill{background:var(--pink);color:#fff}
.hero-swiper{height:50vh}.hero-swiper img{width:100%;height:100%;object-fit:cover}
.swiper-slide{position:relative}
.slide-actions{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.icon-btn{background:rgba(0,0,0,.7);border:none;color:#fff;width:35px;height:35px;border-radius:50%;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:15px}
.folder{background:#1a1a1e;border:1px solid #222;border-radius:15px;padding:20px;text-align:center;cursor:pointer}
.folder:hover{border-color:var(--pink)}
.card{position:relative;border-radius:12px;overflow:hidden;background:#1a1a1e;aspect-ratio:1}
.card img{width:100%;height:100%;object-fit:cover}
.card.overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:10px;display:flex;justify-content:space-between}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.active{display:flex}
.box{background:#1e1e22;padding:25px;border-radius:20px;width:100%;max-width:380px;border:1px solid #333}
.input{width:100%;padding:12px 15px;border-radius:10px;border:1px solid #333;background:#0f0f10;color:#fff;margin:8px 0}
.pass-wrap{position:relative}.eye{position:absolute;right:12px;top:18px;cursor:pointer}
.hide{display:none!important}
.upload-area{border:2px dashed #333;border-radius:15px;padding:20px;text-align:center;margin:10px 0}
.admin-only{border:1px dashed var(--pink)}
</style>
</head>
<body>

<div class="header">
<div class="logo">Manuj & Venus</div>
<div>
<span id="userEmail" style="opacity:.7;font-size:.8rem;margin-right:10px"></span>
<button id="loginBtn" class="btn">Login</button>
<button id="logoutBtn" class="btn hide">SignOut</button>
<button id="adminBtn" class="btn hide" style="border-color:gold;color:gold">Admin Panel</button>
</div>
</div>

<!-- SLIDESHOW -->
<div class="swiper hero-swiper"><div class="swiper-wrapper" id="slideWrapper"></div></div>

<!-- FOLDERS -->
<div style="padding:15px;display:flex;justify-content:space-between;align-items:center">
<h3>Folders</h3><button id="newFolderBtn" class="btn btn-fill hide admin-only-btn">+ Folder</button>
</div>
<div class="grid" id="folderGrid"></div>

<!-- PHOTOS -->
<div style="padding:15px;display:flex;justify-content:space-between;align-items:center">
<h3>Photos <small style="opacity:.5">Max 2MB</small></h3>
<button id="uploadBtn" class="btn btn-fill hide admin-only-btn">+ Photo Upload</button>
</div>
<div class="grid" id="photoGrid"></div>

<!-- LOGIN MODAL -->
<div class="modal" id="authModal">
<div class="box">
<h2 style="font-family:'Great Vibes',cursive;color:var(--pink);font-size:2.5rem;text-align:center">Welcome</h2>
<input id="emailInput" class="input" type="email" placeholder="Google Mail ID">
<div class="pass-wrap"><input id="passInput" class="input" type="password" placeholder="Password"><span class="eye" onclick="togglePass()">👁️</span></div>
<button id="signupEmailBtn" class="btn btn-fill" style="width:100%;margin-top:10px">SignUp</button>
<button id="loginEmailBtn" class="btn" style="width:100%;margin-top:8px">Login</button>
<button id="googleBtn" class="btn" style="width:100%;margin-top:8px;background:#fff;color:#000">Continue with Google</button>
<p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" onclick="closeModal()">Close</p>
<div style="margin-top:15px;padding-top:15px;border-top:1px solid #333"><p style="font-size:.8rem;opacity:.6;text-align:center">Admin Login</p><input id="adminEmail" class="input" placeholder="Admin Mail"><div class="pass-wrap"><input id="adminPass" class="input" type="password" placeholder="Admin Password"><span class="eye" onclick="toggleAdminPass()">👁️</span></div><button id="adminLoginBtn" class="btn" style="width:100%;border-color:gold;color:gold">Admin Login</button></div>
</div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal" id="upModal"><div class="box"><h3>Upload Photo (Max 2MB)</h3><input id="folderSelect" class="input" placeholder="Folder Name (e.g., Wedding)"><div class="upload-area"><input type="file" id="fileInput" accept="image/*"><p style="opacity:.5;font-size:.8rem">2MB ভিতৰত</p></div><input id="captionInput" class="input" placeholder="Caption"><button id="savePhotoBtn" class="btn btn-fill" style="width:100%">Save</button><p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" onclick="closeUp()">Cancel</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script type="module">
// IMPORT FIREBASE - আপোনাৰ Config ইয়াত Paste কৰক
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_DOMAIN",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_BUCKET",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app); const db = getFirestore(app); const storage = getStorage(app);
const provider = new GoogleAuthProvider();

// DEMO WITHOUT FIREBASE (LocalStorage) - Firebase Config নিদিলেও চলিব!
let isAdmin=false; let currentFolder='All';
const $ = id=>document.getElementById(id);
function togglePass(){let i=$('passInput'); i.type=i.type==='password'?'text':'password'}
window.togglePass=togglePass; window.toggleAdminPass=()=>{let i=$('adminPass'); i.type=i.type==='password'?'text':'password'}
function closeModal(){$('authModal').classList.remove('active')}window.closeModal=closeModal
function closeUp(){$('upModal').classList.remove('active')}window.closeUp=closeUp
$('loginBtn').onclick=()=>$('authModal').classList.add('active')
$('uploadBtn').onclick=()=>$('upModal').classList.add('active')
$('newFolderBtn').onclick=()=>{let n=prompt('Folder Name:'); if(n){let f=JSON.parse(localStorage.getItem('folders')||'["All"]'); f.push(n); localStorage.setItem('folders',JSON.stringify(f)); loadFolders()}}
$('fileInput').onchange=e=>{if(e.target.files[0].size>2*1024*1024){alert('Photo 2MB তকৈ ডাঙৰ! 2MB ভিতৰত দিয়ক প্ৰভু'); e.target.value=''}}

$('savePhotoBtn').onclick=async()=>{
  let file=$('fileInput').files[0]; if(!file) return alert('Photo Select কৰক'); if(file.size>2*1024*1024) return alert('2MB ভিতৰত লাগে');
  let reader=new FileReader(); reader.onload=()=>{let photos=JSON.parse(localStorage.getItem('photos')||'[]'); photos.push({id:Date.now(), folder:$('folderSelect').value||'All', caption:$('captionInput').value, src:reader.result}); localStorage.setItem('photos',JSON.stringify(photos)); closeUp(); loadPhotos(); loadSlides();}; reader.readAsDataURL(file);
}
function loadFolders(){let f=JSON.parse(localStorage.getItem('folders')||'["All","Wedding","Travel"]'); $('folderGrid').innerHTML=f.map(name=>`<div class="folder" onclick="filterFolder('${name}')"><div style="font-size:2rem">📁</div><p>${name}</p></div>`).join('')}
window.filterFolder=n=>{currentFolder=n; loadPhotos()}
function loadPhotos(){
  let photos=JSON.parse(localStorage.getItem('photos')||'[]'); let filtered=currentFolder==='All'?photos:photos.filter(p=>p.folder===currentFolder);
  $('photoGrid').innerHTML=filtered.map(p=>`
    <div class="card">
      <img src="${p.src}">
      <div class="overlay">
        <small>${p.caption||''}</small>
        <div style="display:flex;gap:5px">
          <button class="icon-btn" onclick="sharePhoto('${p.src}')">↗️</button>
          <button class="icon-btn" onclick="downloadPhoto('${p.src}')">⬇️</button>
          <button class="icon-btn ${!isAdmin?'hide':''}" onclick="editPhoto(${p.id})">✏️</button>
          <button class="icon-btn ${!isAdmin?'hide':''}" onclick="deletePhoto(${p.id})">🗑️</button>
        </div>
      </div>
    </div>`).join('') || '<p style="opacity:.4;padding:20px">No Photos - Upload কৰক</p>';
}
window.sharePhoto=async src=>{if(navigator.share){await navigator.share({title:'Manuj Venus', url:src})}else{prompt('Share Link Copy কৰক:', location.href)}}
window.downloadPhoto=src=>{let a=document.createElement('a'); a.href=src; a.download='manuj-venus.jpg'; a.click()}
window.deletePhoto=id=>{if(confirm('Delete কৰিব নে?')){let photos=JSON.parse(localStorage.getItem('photos')||'[]').filter(p=>p.id!==id); localStorage.setItem('photos',JSON.stringify(photos)); loadPhotos(); loadSlides()}}
window.editPhoto=id=>{let cap=prompt('New Caption:'); if(cap!==null){let photos=JSON.parse(localStorage.getItem('photos')||'[]'); let p=photos.find(x=>x.id===id); p.caption=cap; localStorage.setItem('photos',JSON.stringify(photos)); loadPhotos()}}
function loadSlides(){let photos=JSON.parse(localStorage.getItem('photos')||'[]'); $('slideWrapper').innerHTML=photos.slice(0,5).map(p=>`<div class="swiper-slide"><img src="${p.src}"><div class="slide-actions ${!isAdmin?'hide':''}"><button class="icon-btn" onclick="editPhoto(${p.id})">✏️</button><button class="icon-btn" onclick="deletePhoto(${p.id})">🗑️</button></div></div>`).join(''); new Swiper('.hero-swiper',{autoplay:{delay:2500},loop:true})}
$('adminLoginBtn').onclick=()=>{if($('adminEmail').value && $('adminPass').value){isAdmin=true; localStorage.setItem('isAdmin','1'); $('authModal').classList.remove('active'); checkAdmin(); alert('Admin Login Success প্ৰভু!')}}
function checkAdmin(){if(localStorage.getItem('isAdmin')==='1'){isAdmin=true; document.querySelectorAll('.admin-only-btn').forEach(b=>b.classList.remove('hide')); $('adminBtn').classList.remove('hide'); $('logoutBtn').classList.remove('hide'); $('loginBtn').classList.add('hide')} loadPhotos(); loadSlides()}
$('logoutBtn').onclick=()=>{isAdmin=false; localStorage.removeItem('isAdmin'); document.querySelectorAll('.admin-only-btn').forEach(b=>b.classList.add('hide')); $('adminBtn').classList.add('hide'); $('logoutBtn').classList.add('hide'); $('loginBtn').classList.remove('hide'); alert('SignOut হল - Admin Hide হল প্ৰভু')};
$('adminBtn').onclick=()=>{let f=prompt('Folder Delete কৰিব? নাম লিখক'); if(f){let folders=JSON.parse(localStorage.getItem('folders')||'[]').filter(x=>x!==f); localStorage.setItem('folders',JSON.stringify(folders)); loadFolders()}}
checkAdmin(); loadFolders(); loadPhotos(); loadSlides();
</script>
</body>
</html>
