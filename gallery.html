<script>
let db; let req=indexedDB.open('VenusDB',1);
req.onsuccess=e=>{
 db=e.target.result;
 let tx=db.transaction('products','readonly');
 tx.objectStore('products').getAll().onsuccess=ev=>{
  let products=ev.target.result||[];
  document.getElementById('pcount').innerText=products.length+' PHOTOS';
  let h=''; if(!products.length) h='<div style="grid-column:1/3;text-align:center;opacity:.4;padding:60px">📸 নাই<br><a href="admin.html" style="color:#ff4d88">Upload কৰক</a></div>';
  products.forEach(p=>{let m=encodeURIComponent('Hi Venus! '+p.name); h+=`<div class="card"><img src="${p.photo}"><div class="info"><div>${p.name}</div><div class="price">₹${p.price}</div><button class="buy" onclick="window.open('https://wa.me/919999999999?text=${m}','_blank')">Buy Now</button></div></div>`;});
  document.getElementById('grid').innerHTML=h;
 };
};
</script>
