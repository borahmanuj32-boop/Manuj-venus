<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Manuj & Venus</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Poppins',sans-serif}
h1{font-family:'Great Vibes',cursive;text-align:center;font-size:4rem;color:#ff4d88;margin:40px 0 10px}
.sub{text-align:center;opacity:.6;letter-spacing:3px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}
.card{position:relative;overflow:hidden;border-radius:20px;background:#1a1a1a;aspect-ratio:1;transition:.4s;border:1px solid #222}
.card:hover{transform:translateY(-10px);border-color:#ff4d88;box-shadow:0 20px 40px rgba(255,77,136,.3)}
.card img{width:100%;height:100%;object-fit:cover}
.card .info{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.card .info h3{font-family:'Great Vibes',cursive;font-size:1.8rem;color:#ff8fb1}
.back{display:block;text-align:center;margin:40px;color:#ff4d88;text-decoration:none}
</style>
</head>
<body>
<h1>Our Memories</h1>
<p class="sub">MANUJ VENUS COLLECTION</p>

<div class="grid">
  <div class="card"><img src="https://picsum.photos/seed/1/500"><div class="info"><h3>First Meet</h3></div></div>
  <div class="card"><img src="https://picsum.photos/seed/2/500"><div class="info"><h3>Together</h3></div></div>
  <div class="card"><img src="https://picsum.photos/seed/3/500"><div class="info"><h3>Smile</h3></div></div>
  <div class="card"><img src="https://picsum.photos/seed/4/500"><div class="info"><h3>Forever</h3></div></div>
  <div class="card"><img src="https://picsum.photos/seed/5/500"><div class="info"><h3>Love</h3></div></div>
  <div class="card"><img src="https://picsum.photos/seed/6/500"><div class="info"><h3>Dreams</h3></div></div>
</div>

<a href="index.html" class="back">← Back to Home</a>
</body>
</html>
