<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuj & Venus</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:'Poppins',sans-serif}
:root{--pink:#ff4d88}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{font-family:'Great Vibes',cursive;font-size:2rem;color:var(--pink)}
.btn{padding:8px 16px;border-radius:22px;border:1px solid var(--pink);background:transparent;color:var(--pink);cursor:pointer;font-weight:600}
.btn-fill{background:var(--pink);color:#fff}
.hero-swiper{height:48vh;background:#111}.hero-swiper img{width:100%;height:100%;object-fit:cover}
.slide-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.icon-btn{background:rgba(0,0,0,.75);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.folder{background:#1a1a1e;border:1px solid #222;border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.folder.active{border-color:var(--pink)}
.card{position:relative;border-radius:12px;overflow:hidden;background:#1a1a1e;aspect-ratio:1}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ov{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:8px;display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:500;padding:18px}
.modal.active{display:flex}
.box{background:#1e1e22;padding:22px;border-radius:20px;width:100%;max-width:380px;border:1px solid #333;max-height:90vh;overflow:auto}
.input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #333;background:#0f0f10;color:#fff;margin:7px 0;outline:none}
.pass-wrap{position:relative}.eye{position:absolute;right:12px;top:17px;cursor:pointer;user-select:none}
.hide{display:none!important}
.upload-area{border:2px dashed #333;border-radius:12px;padding:18px;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div class="header">
<div class="logo">Manuj & Venus</div>
<div style="display:flex;gap:8px;align-items:center">
<span id="userEmail" style="opacity:.7;font-size:.75rem"></span>
<button id="loginBtn" class="btn">Login</button>
<button id="logoutBtn" class="btn hide">SignOut</button>
</div>
</div>

<div class="swiper hero-swiper"><div class="swiper-wrapper" id="slideWrapper"></div></div>

<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>Folders</h3><button id="newFolderBtn" class="btn btn-fill hide">+ Folder</button></div>
<div class="grid" id="folderGrid"></div>

<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>Photos <small style="opacity:.5">Max 2MB</small></h3><button id="uploadBtn" class="btn btn-fill hide">+ Upload</button></div>
<div class="grid" id="photoGrid"></div>

<div class="modal" id="authModal">
<div class="box">
<h2 style="font-family:'Great Vibes',cursive;color:var(--pink);font-size:2.6rem;text-align:center">স্বাগতম</h2>
<input id="emailInput" class="input" type="email" placeholder="borahmanuj32@gmail.com">
<div class="pass-wrap"><input id="passInput" class="input" type="password" placeholder="venus123"><span class="eye" id="eye1">👁️</span></div>
<button id="signupEmailBtn" class="btn btn-fill" style="width:100%;margin-top:10px;padding:12px">চাইনআপ কৰক</button>
<button id="loginEmailBtn" class="btn" style="width:100%;margin-top:8px;padding:12px">লগইন কৰক</button>
<button id="googleBtn" class="btn" style="width:100%;margin-top:8px;background:#fff;color:#000;padding:12px">গুগলৰ সৈতে আগবাঢ়ি যাওক</button>
<p style="text-align:center;margin-top:12px;opacity:.6;cursor:pointer" id="closeAuth">বন্ধ</p>
<hr style="margin:16px 0;border:0;border-top:1px solid #333">
<p style="text-align:center;opacity:.7;margin-bottom:8px">প্ৰশাসক লগইন</p>
<input id="adminEmail" class="input" placeholder="এডমিন মেইল">
<div class="pass-wrap"><input id="adminPass" class="input" type="password" placeholder="প্ৰশাসক পাছৱৰ্ড"><span class="eye" id="eye2">👁️</span></div>
<button id="adminLoginBtn" class="btn" style="width:100%;border-color:gold;color:gold;margin-top:6px;padding:12px">প্ৰশাসক লগইন</button>
</div>
</div>

<div class="modal" id="upModal"><div class="box"><h3>Upload Photo (2MB ভিতৰত)</h3>
<select id="folderSelect" class="input"></select>
<div class="upload-area"><input type="file" id="fileInput" accept="image/*"><p style="opacity:.5;font-size:.8rem;margin-top:6px">2MB ভিতৰত হব লাগিব</p><img id="preview" class="hide" style="width:100%;margin-top:10px;border-radius:10px;max-height:200px;object-fit:cover"></div>
<input id="captionInput" class="input" placeholder="Caption লিখক">
<button id="savePhotoBtn" class="btn btn-fill" style="width:100%;padding:12px">Save</button>
<p style="text-align:center;margin-top:10px;opacity:.5;cursor:pointer" id="closeUp">Cancel</p>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
let isAdmin=false; let currentFolder='All'; let currentUser=null;
const $=id=>document.getElementById(id);
function getUsers(){return JSON.parse(localStorage.getItem('mv_users')||'[]')}
function saveUsers(u){localStorage.setItem('mv_users',JSON.stringify(u))}
function getPhotos(){return JSON.parse(localStorage.getItem('mv_photos')||'[]')}
function savePhotos(p){localStorage.setItem('mv_photos',JSON.stringify(p))}
function getFolders(){return JSON.parse(localStorage.getItem('mv_folders')||'["All","আটাইবোৰ","বিবাহ"]')}
function saveFolders(f){localStorage.setItem('mv_folders',JSON.stringify(f))}
function toggleType(inp){inp.type=inp.type==='password'?'text':'password'}
$('eye1').onclick=()=>toggleType($('passInput'));
$('eye2').onclick=()=>toggleType($('adminPass'));
$('closeAuth').onclick=()=>$('authModal').classList.remove('active');
$('closeUp').onclick=()=>$('upModal').classList.remove('active');
$('loginBtn').onclick=()=>$('authModal').classList.add('active');
$('uploadBtn').onclick=()=>{refreshFolderSelect(); $('upModal').classList.add('active')}
$('newFolderBtn').onclick=()=>{let n=prompt('Folder Name:'); if(n){let f=getFolders(); if(!f.includes(n)){f.push(n); saveFolders(f); loadFolders();}}}
$('fileInput').onchange=e=>{
  let file=e.target.files[0]; if(!file) return;
  if(file.size>2*1024*1024){alert('2MB তকৈ ডাঙৰ! সৰু Photo দিয়ক প্ৰভু'); e.target.value=''; return;}
  let reader=new FileReader(); reader.onload=()=>{ $('preview').src=reader.result; $('preview').classList.remove('hide'); $('preview').dataset.base64=reader.result; }; reader.readAsDataURL(file);
}
$('signupEmailBtn').onclick=()=>{
  let email=$('emailInput').value.trim(); let pass=$('passInput').value.trim();
  if(!email||!pass) return alert('Mail আৰু Password দিয়ক');
  let users=getUsers(); if(users.find(u=>u.email===email)) return alert('এই Mail ৰে আগতে SignUp হৈছে, Login কৰক');
  users.push({email,pass}); saveUsers(users); currentUser={email}; localStorage.setItem('mv_current',JSON.stringify(currentUser));
  alert('SignUp Success!'); afterLogin();
}
$('loginEmailBtn').onclick=()=>{
  let email=$('emailInput').value.trim(); let pass=$('passInput').value.trim();
  let users=getUsers(); let u=users.find(x=>x.email===email && x.pass===pass);
  if(!u) return alert('Mail বা Password ভুল!');
  currentUser={email}; localStorage.setItem('mv_current',JSON.stringify(currentUser)); alert('Login Success!'); afterLogin();
}
$('googleBtn').onclick=()=>{
  let email=$('emailInput').value.trim()||'borahmanuj32@gmail.com';
  currentUser={email}; localStorage.setItem('mv_current',JSON.stringify(currentUser)); alert('Google Login Success!'); afterLogin();
}
$('adminLoginBtn').onclick=()=>{
  let e=$('adminEmail').value.trim(); let p=$('adminPass').value.trim();
  if(!e||!p) return alert('Admin Mail Pass দিয়ক');
  isAdmin=true; localStorage.setItem('mv_admin','1'); currentUser={email:e}; localStorage.setItem('mv_current',JSON.stringify(currentUser));
  alert('Admin Login Success প্ৰভু!'); $('authModal').classList.remove('active'); checkAuth();
}
function afterLogin(){ $('authModal').classList.remove('active'); checkAuth(); }
$('savePhotoBtn').onclick=()=>{
  let b64=$('preview').dataset.base64;
  if(!b64) return alert('Photo Select কৰক');
  let folder=$('folderSelect').value||'All'; let cap=$('captionInput').value;
  let photos=getPhotos(); photos.push({id:Date.now(), folder, caption:cap, src:b64, time:Date.now()}); savePhotos(photos);
  $('upModal').classList.remove('active'); $('fileInput').value=''; $('preview').classList.add('hide'); $('captionInput').value='';
  loadPhotos(); loadSlides();
}
function checkAuth(){
  let cur=JSON.parse(localStorage.getItem('mv_current')||'null'); let admin=localStorage.getItem('mv_admin')==='1';
  if(cur){ currentUser=cur; $('userEmail').textContent=cur.email; $('loginBtn').classList.add('hide'); $('logoutBtn').classList.remove('hide'); }
  if(admin){ isAdmin=true; $('newFolderBtn').classList.remove('hide'); $('uploadBtn').classList.remove('hide'); }
  loadPhotos(); loadSlides();
}
$('logoutBtn').onclick=()=>{ localStorage.removeItem('mv_current'); localStorage.removeItem('mv_admin'); isAdmin=false; currentUser=null; $('userEmail').textContent=''; $('loginBtn').classList.remove('hide'); $('logoutBtn').classList.add('hide'); $('newFolderBtn').classList.add('hide'); $('uploadBtn').classList.add('hide'); alert('SignOut হল - Admin Hide হল প্ৰভু'); loadPhotos(); loadSlides(); }
function refreshFolderSelect(){ let f=getFolders(); $('folderSelect').innerHTML=f.map(n=>`<option value="${n}">${n}</option>`).join(''); }
function loadFolders(){ let f=getFolders(); refreshFolderSelect(); $('folderGrid').innerHTML=f.map(name=>`<div class="folder ${currentFolder===name?'active':''}" onclick="filterFolder('${name}')"><div style="font-size:2rem">📁</div><p>${name}</p></div>`).join(''); }
window.filterFolder=n=>{ currentFolder=n; loadFolders(); loadPhotos(); }
function loadPhotos(){
  let photos=getPhotos(); let filtered=currentFolder==='All'?photos:photos.filter(p=>p.folder===currentFolder);
  if(filtered.length===0){ $('photoGrid').innerHTML='<p style="opacity:.4;padding:20px;grid-column:1/-1">No Photos - Admin Login কৰি Upload কৰক প্ৰভু</p>'; return; }
  $('photoGrid').innerHTML=filtered.map(p=>`
    <div class="card">
      <img src="${p.src}" onclick="window.open().document.write('<img src='+p.src+' style=width:100%>')">
      <div class="ov">
        <small style="max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.caption||''}</small>
        <div style="display:flex;gap:4px">
          <button class="icon-btn" onclick="sharePhoto('${p.id}')">↗️</button>
          <button class="icon-btn" onclick="downloadPhoto('${p.id}')">⬇️</button>
          <button class="icon-btn ${!isAdmin?'hide':''}" onclick="editPhoto(${p.id})">✏️</button>
          <button class="icon-btn ${!isAdmin?'hide':''}" onclick="deletePhoto(${p.id})">🗑️</button>
        </div>
      </div>
    </div>`).join('');
}
window.sharePhoto=async id=>{
  let p=getPhotos().find(x=>x.id==id); if(navigator.share){ try{await navigator.share({title:p.caption, text:'Manuj & Venus', url:location.href})}catch(e){} }else{ prompt('Link Copy কৰক:', location.href) }
}
window.downloadPhoto=id=>{ let p=getPhotos().find(x=>x.id==id); let a=document.createElement('a'); a.href=p.src; a.download=(p.caption||'photo')+'.jpg'; a.click(); }
window.deletePhoto=id=>{ if(confirm('Delete কৰিব নে প্ৰভু?')){ let photos=getPhotos().filter(p=>p.id!=id); savePhotos(photos); loadPhotos(); loadSlides(); } }
window.editPhoto=id=>{ let cap=prompt('New Caption:'); if(cap!==null){ let photos=getPhotos(); let p=photos.find(x=>x.id==id); p.caption=cap; savePhotos(photos); loadPhotos(); } }
function loadSlides(){
  let photos=getPhotos(); if(photos.length===0){ $('slideWrapper').innerHTML='<div class="swiper-slide" style="display:flex;align-items:center;justify-content:center"><p style="opacity:.5">No Photos - Upload কৰক</p></div>'; return; }
  $('slideWrapper').innerHTML=photos.slice(0,8).map(p=>`<div class="swiper-slide"><img src="${p.src}"><div class="slide-actions ${!isAdmin?'hide':''}"><button class="icon-btn" onclick="event.stopPropagation(); editPhoto(${p.id})">✏️</button><button class="icon-btn" onclick="event.stopPropagation(); deletePhoto(${p.id})">🗑️</button><button class="icon-btn" onclick="event.stopPropagation(); downloadPhoto(${p.id})">⬇️</button></div></div>`).join('');
  new Swiper('.hero-swiper',{autoplay:{delay:2500},loop:true});
}
checkAuth(); loadFolders(); loadPhotos(); loadSlides();
</script>
</body>
</html>
