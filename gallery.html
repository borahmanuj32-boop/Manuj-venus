<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manuj & Venus - Gallery Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#fff;font-family:sans-serif}
.h{position:sticky;top:0;background:#15151a;padding:14px;border-bottom:1px solid #222;z-index:10;display:flex;justify-content:space-between}
.h b{color:#ff4d88}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px}
.cd{background:#18181f;border:1px solid #222;border-radius:14px;overflow:hidden}
.cb{width:100%;height:200px;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cb img{width:100%;height:100%;object-fit:cover}
.inf{padding:10px}
.btn-p{background:#ff4d88;border:0;color:#fff;padding:10px;width:100%;border-radius:8px;font-weight:700;margin-top:6px}
.ap{background:#1a1a22;border:1px solid #333;border-radius:12px;padding:12px;margin:12px}
.ap input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
</style>
</head>
<body>
<div class="h"><b>📸 VENUS GALLERY</b><span style="font-size:.7rem;opacity:.6">Public ✅</span></div>

<div class="gr" id="g"></div>

<script>
// আপোনাৰ pCloud ফটো - Public এ দেখিব
let products = [
{
name: "Venus Special Photo",
price: "499",
photo: "https://api.pcloud.com/getpublinkdownload?code=kZadS95ZPM3oBqFdQF5utDq7IEPuXj5FgxGX"
},
{
name: "Venus T-Shirt",
price: "599",
photo: "https://api.pcloud.com/getpublinkdownload?code=kZadS95ZPM3oBqFdQF5utDq7IEPuXj5FgxGX"
}
];

function render(){
let h='';
products.forEach(p=>{
h+=`<div class="cd"><div class="cb"><img src="${p.photo}"></div><div class="inf"><b>${p.name}</b><br><small style="color:#ff4d88">₹${p.price}</small><button class="btn-p" onclick="buy('${p.name}','${p.price}')">Buy Now - WhatsApp</button></div></div>`;
});
document.getElementById('g').innerHTML=h;
}
function buy(n,p){
let m=`Hello Manuj! 🛒%0AProduct: ${n}%0APrice: ₹${p}%0APhoto: https://api.pcloud.com/getpublinkdownload?code=kZadS95ZPM3oBqFdQF5utDq7IEPuXj5FgxGX%0ALink: ${location.href}`;
window.open(`https://wa.me/919101573700?text=${m}`,'_blank');
}
render();
</script>
</body>
</html>
