<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuj & Venus - Final</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0c;color:#fff;font-family:'Poppins',sans-serif}
:root{--pink:#ff4d88}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{font-family:'Great Vibes',cursive;font-size:2rem;color:var(--pink)}
.btn{padding:9px 18px;border-radius:22px;border:1px solid var(--pink);background:transparent;color:var(--pink);cursor:pointer;font-weight:600}
.btn-fill{background:var(--pink);color:#fff}
.hero{height:42vh;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.folder{background:#1a1a1e;border:1px solid #222;border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.folder.active{border-color:var(--pink);background:#21151a}
.card{position:relative;border-radius:12px;overflow:hidden;background:#1a1a1e;aspect-ratio:1;border:1px solid #222}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ov{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:8px;display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.90);display:none;align-items:center;justify-content:center;z-index:500;padding:18px}
.modal.active{display:flex}
.box{background:#1e1e22;padding:22px;border-radius:20px;width:100%;max-width:400px;border:1px solid #333;max-height:92vh;overflow:auto}
.input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #333;background:#0f0f10;color:#fff;margin:7px 0;outline:none}
.pass-wrap{position:relative}.eye{position:absolute;right:12px;top:17px;cursor:pointer}
.hide{display:none!important}
.upload-area{border:2px dashed #444;border-radius:12px;padding:18px;text-align:center;margin:10px 0;background:#0f0f10}
.icon-btn{background:rgba(0,0,0,.8);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#preview{width:100%;margin-top:10px;border-radius:10px;max-height:220px;object-fit:cover;border:1px solid #333}
</style>
</head>
<body>
<div class="header"><div class="logo">Manuj & Venus</div><div style="display:flex;gap:8px;align-items:center"><span id="userEmail" style="opacity:.7;font-size:.75rem"></span><button id="loginBtn" class="btn">Login</button><button id="logoutBtn" class="btn hide">SignOut</button></div></div>
<div class="hero" id="hero"><p style="opacity:.5">No Photos - Upload কৰক</p></div>
<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>📁 Folders</h3><button id="newFolderBtn" class="btn btn-fill hide">+ Folder</button></div>
<div class="grid" id="folderGrid"></div>
<div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><h3>🖼️ Photos <small style="opacity:.5">3KB-10MB</small></h3><button id="uploadBtn" class="btn btn-fill hide">+ Upload</button></div>
<div class="grid" id="photoGrid"></div>
<div class="modal" id="authModal"><div class="box"><h2 style="font-family:'Great Vibes',cursive;color:var(--pink);font-size:2.6rem;text-align:center">স্বাগতম</h2><input id="emailInput" class="input" type="email" placeholder="borahmanuj32@gmail.com" value="borahmanuj32@gmail.com"><div class="pass-wrap"><input id="passInput" class="input" type="password" placeholder="venus123" value="venus123"><span class="eye" id="eye1">👁️</span></div><button id="signupEmailBtn" class="btn btn-fill" style="width:100%;margin-top:10px;padding:13px">চাইনআপ কৰক - SignUp</button><button id="loginEmailBtn" class="btn" style="width:100%;margin-top:8px;padding:13px">লগইন কৰক - Login</button><button id="googleBtn" class="btn" style="width:100%;margin-top:8px;background:#fff;color:#000;padding:13px">গুগলৰ সৈতে আগবাঢ়ি যাওক</button><p style="text-align:center;margin-top:12px;opacity:.6;cursor:pointer" id="closeAuth">বন্ধ</p><hr style="margin:16px 0;border:0;border-top:1px solid #333"><p style="text-align:center;opacity:.7;margin-bottom:8px">প্ৰশাসক লগইন - Admin</p><input id="adminEmail" class="input" placeholder="এডমিন মেইল" value="borahmanuj32@gmail.com"><div class="pass-wrap"><input id="adminPass" class="input" type="password" placeholder="প্ৰশাসক পাছৱৰ্ড" value="venus123"><span class="eye" id="eye2">👁️</span></div><button id="adminLoginBtn" class="btn" style="width:100%;border-color:gold;color:gold;margin-top:6px;padding:13px">প্ৰশাসক লগইন - Admin Login</button></div></div>
<div class="modal" id="upModal"><div class="box"><h3>Upload Photo (3KB - 10MB)</h3><select id="folderSelect" class="input"></select><div class="upload-area"><input type="file" id="fileInput" accept="image/*" style="width:100%"><p id="fileInfo" style="opacity:.6;font-size:.85rem;margin-top:8px">Photo Select কৰক - 3KB ৰ পৰা 10MB লৈ</p><img id="preview" class="hide"></div><input id="captionInput" class="input" placeholder="Caption লিখক (art, girls...)"><button id="savePhotoBtn" class="btn btn-fill" style="width:100%;padding:13px;margin-top:8px">💾 Save Photo</button><p style="text-align:center;margin-top:12px;opacity:.5;cursor:pointer" id="closeUp">Cancel</p><p id="status" style="text-align:center;margin-top:8px;color:var(--pink);font-size:.9rem"></p></div></div>
<script>
let currentFolder='All';let selectedFile=null;let selectedBase64=null;let slideIndex=0;let slideTimer=null;const $=id=>document.getElementById(id);
function getUsers(){return JSON.parse(localStorage.getItem('mv_users')||'[]')}function saveUsers(u){localStorage.setItem('mv_users',JSON.stringify(u))}
function getPhotos(){return JSON.parse(localStorage.getItem('mv_photos')||'[]')}function savePhotos(p){localStorage.setItem('mv_photos',JSON.stringify(p))}
function getFolders(){return JSON.parse(localStorage.getItem('mv_folders')||'["All","Girls","art","Wedding","Travel"]')}function saveFolders(f){localStorage.setItem('mv_folders',JSON.stringify(f))}
$('eye1').onclick=()=>{$('passInput').type=$('passInput').type==='password'?'text':'password';};$('eye2').onclick=()=>{$('adminPass').type=$('adminPass').type==='password'?'text':'password';};
$('closeAuth').onclick=()=>$('authModal').classList.remove('active');$('closeUp').onclick=()=>{$('upModal').classList.remove('active');$('status').textContent='';};
$('loginBtn').onclick=()=>$('authModal').classList.add('active');$('uploadBtn').onclick=()=>{refreshFolderSelect();$('upModal').classList.add('active');$('status').textContent='';};
$('newFolderBtn').onclick=()=>{let n=prompt('Folder Name লিখক:');if(n){n=n.trim();let f=getFolders();if(!f.includes(n)){f.push(n);saveFolders(f);loadFolders();}}};
$('fileInput').onchange=(e)=>{let file=e.target.files[0];if(!file){selectedFile=null;selectedBase64=null;return;}selectedFile=file;let sizeKB=(file.size/1024).toFixed(1);let sizeMB=(file.size/1024/1024).toFixed(2);$('fileInfo').textContent=`Selected: ${file.name} - ${sizeKB} KB (${sizeMB} MB)`;if(file.size>10*1024*1024){$('fileInfo').textContent=`❌ বহুত ডাঙৰ! ${sizeMB} MB - 10MB ৰ তলত দিয়ক`;return;}let reader=new FileReader();reader.onload=()=>{selectedBase64=reader.result;$('preview').src=selectedBase64;$('preview').classList.remove('hide');$('status').textContent='✅ Ready to Save - Save ত Click কৰক';};reader.readAsDataURL(file);};
$('signupEmailBtn').onclick=()=>{let email=$('emailInput').value.trim();let pass=$('passInput').value.trim();if(!email||!pass)return alert('Mail আৰু Password দিয়ক');let users=getUsers();if(users.find(u=>u.email===email))return alert('এই Mail ৰে আগতে SignUp হৈছে, Login কৰক');users.push({email,pass});saveUsers(users);localStorage.setItem('mv_current',JSON.stringify({email}));alert('✅ SignUp Success!');$('authModal').classList.remove('active');checkAuth();};
$('loginEmailBtn').onclick=()=>{let email=$('emailInput').value.trim();let pass=$('passInput').value.trim();let users=getUsers();let u=users.find(x=>x.email===email&&x.pass===pass);if(!u)return alert('❌ Mail বা Password ভুল!');localStorage.setItem('mv_current',JSON.stringify({email}));alert('✅ Login Success!');$('authModal').classList.remove('active');checkAuth();};
$('googleBtn').onclick=()=>{let email=$('emailInput').value.trim()||'borahmanuj32@gmail.com';localStorage.setItem('mv_current',JSON.stringify({email}));alert('✅ Google Login Success!');$('authModal').classList.remove('active');checkAuth();};
$('adminLoginBtn').onclick=()=>{let e=$('adminEmail').value.trim();let p=$('adminPass').value.trim();if(!e||!p)return alert('Admin Mail Pass দিয়ক');localStorage.setItem('mv_current',JSON.stringify({email:e}));localStorage.setItem('mv_admin','1');alert('👑 Admin Login Success! Upload আহিল');$('authModal').classList.remove('active');checkAuth();};
$('savePhotoBtn').onclick=()=>{if(!selectedBase64){if(selectedFile){$('status').textContent='File পঢ়ি আছে...';let reader=new FileReader();reader.onload=()=>{selectedBase64=reader.result;doSave();};reader.readAsDataURL(selectedFile);return;}else{$('status').textContent='❌ Photo Select কৰক';alert('Photo Select কৰক!');return;}}doSave();};
function doSave(){let folder=$('folderSelect').value||'All';let cap=$('captionInput').value.trim()||'art';let photos=getPhotos();try{photos.push({id:Date.now(),folder,caption:cap,src:selectedBase64,time:Date.now()});savePhotos(photos);}catch(e){alert('Storage Full! কিছু Delete কৰক. '+e.message);return;}$('status').textContent='✅ Saved!';setTimeout(()=>{$('upModal').classList.remove('active');$('fileInput').value='';$('preview').classList.add('hide');$('captionInput').value='';$('fileInfo').textContent='Photo Select কৰক';$('status').textContent='';selectedFile=null;selectedBase64=null;loadPhotos();loadHero();},500);}
function checkAuth(){let cur=JSON.parse(localStorage.getItem('mv_current')||'null');let admin=localStorage.getItem('mv_admin')==='1';if(cur){$('userEmail').textContent=cur.email;$('loginBtn').classList.add('hide');$('logoutBtn').classList.remove('hide');$('newFolderBtn').classList.remove('hide');$('uploadBtn').classList.remove('hide');}if(admin){$('newFolderBtn').classList.remove('hide');$('uploadBtn').classList.remove('hide');}if(!cur){$('loginBtn').classList.remove('hide');$('logoutBtn').classList.add('hide');$('newFolderBtn').classList.add('hide');$('uploadBtn').classList.add('hide');$('userEmail').textContent='';}loadFolders();loadPhotos();loadHero();}
$('logoutBtn').onclick=()=>{localStorage.removeItem('mv_current');localStorage.removeItem('mv_admin');alert('SignOut হল - Admin Hide হল');checkAuth();};
function refreshFolderSelect(){let f=getFolders();$('folderSelect').innerHTML=f.map(n=>`<option value="${n}">${n}</option>`).join('');}
function loadFolders(){let f=getFolders();refreshFolderSelect();$('folderGrid').innerHTML=f.map(name=>`<div class="folder ${currentFolder===name?'active':''}" onclick="filterFolder('${name}')"><div style="font-size:2rem">📁</div><p>${name}</p></div>`).join('');}
window.filterFolder=n=>{currentFolder=n;loadFolders();loadPhotos();};
function loadPhotos(){let photos=getPhotos();let filtered=currentFolder==='All'?photos:photos.filter(p=>p.folder===currentFolder);if(filtered.length===0){$('photoGrid').innerHTML='<p style="opacity:.4;padding:20px;grid-column:1/-1">No Photos in '+currentFolder+' - Upload কৰক (3KB-10MB)</p>';return;}$('photoGrid').innerHTML=filtered.map(p=>`<div class="card"><img src="${p.src}" onclick="openFull('${p.id}')"><div class="ov"><small style="max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.caption}</small><div style="display:flex;gap:4px"><button class="icon-btn" onclick="sharePhoto('${p.id}')">↗️</button><button class="icon-btn" onclick="downloadPhoto('${p.id}')">⬇️</button><button class="icon-btn" onclick="editPhoto(${p.id})">✏️</button><button class="icon-btn" onclick="deletePhoto(${p.id})">🗑️</button></div></div></div>`).join('');}
window.openFull=id=>{let p=getPhotos().find(x=>x.id==id);let w=window.open();w.document.write('<body style=margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh><img src='+p.src+' style=max-width:100%;max-height:100%></body>');};
window.sharePhoto=async id=>{let p=getPhotos().find(x=>x.id==id);if(navigator.share){try{await navigator.share({title:p.caption,url:location.href})}catch(e){}}else{prompt('Link Copy:',location.href)}};
window.downloadPhoto=id=>{let p=getPhotos().find(x=>x.id==id);let a=document.createElement('a');a.href=p.src;a.download=(p.caption||'photo')+'.jpg';a.click();};
window.deletePhoto=id=>{if(confirm('Delete কৰিব নে?')){let photos=getPhotos().filter(p=>p.id!=id);savePhotos(photos);loadPhotos();loadHero();}};
window.editPhoto=id=>{let cap=prompt('New Caption:');if(cap!==null){let photos=getPhotos();let p=photos.find(x=>x.id==id);if(p){p.caption=cap;savePhotos(photos);loadPhotos();}}};
function loadHero(){let photos=getPhotos();if(photos.length===0){$('hero').innerHTML='<p style=opacity:.5>No Photos - Upload কৰক প্ৰভু</p>';return;}if(slideTimer)clearInterval(slideTimer);function show(i){let p=photos[i%photos.length];$('hero').innerHTML=`<img src="${p.src}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:.85rem">${p.caption} - ${p.folder}</div>`;}show(slideIndex);slideTimer=setInterval(()=>{slideIndex++;show(slideIndex);},3000);$('hero').onclick=()=>{slideIndex++;show(slideIndex);}}
checkAuth();
</script>
</body>
</html>
